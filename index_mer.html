<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Scotch Field Audit — Prototype v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600&display=swap">
<!--
  ============================================================
  Scotch Field Audit — Concept Prototype (single HTML file)
  ------------------------------------------------------------
  • ไฟล์เดียวจบ: HTML + CSS + JS + ข้อมูลจำลอง (ไม่มี database / server จริง)
  • "Server" ในไฟล์นี้ = ฟังก์ชัน serverReceive() ที่จำลองสิ่งที่ API จริงจะทำ
  • ข้อมูลอยู่ในหน่วยความจำ — refresh หน้าแล้วจะกลับไปเป็นค่าเริ่มต้น
  • ใช้งานจริงจะแยกเป็น: PWA (มือถือ) → ASP.NET Core API → SQL Server
  ============================================================
-->
<style>
:root{
  color-scheme: light;
  --bg:#F3F2EF; --page:#E7E5E1; --surface:#FFFFFF; --line:#E4E2DD; --line2:#EEECE8;
  --ink:#1B1A19; --ink2:#57534E; --ink3:#6B665F;
  --red:#C4121A; --red-ink:#A30F16; --brand:#ED1C24; --gold:#E6BF8A;
  --gold-bg:#FBF4E8; --gold-line:#EBDABD; --gold-ink:#6E4F18;
  --ok:#1E7A4C; --ok-bg:#E7F3EC; --ok-ink:#1E6B44;
  --warn-bg:#FDF0E1; --warn-ink:#8A4108; --flag-bg:#FCE8E8; --flag-ink:#9B1C1C;
  --radius:16px;
  --font:'IBM Plex Sans Thai', 'Sarabun', 'Leelawadee UI', 'Thonburi', system-ui, sans-serif;
  --display:'Kanit', 'IBM Plex Sans Thai', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #2F6FDB;outline-offset:2px}
.app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2}
.muted{color:var(--ink3)} .small{font-size:12px} .tiny{font-size:11px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}

/* header */
.hdr{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-top{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{height:28px;width:auto;display:block}
.vsep{width:1px;height:22px;background:var(--line)}
.app-name{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.02em}
.net{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;border:0;font-size:12px;font-weight:600}
.net.on{background:var(--ok-bg);color:var(--ok-ink)} .net.off{background:var(--warn-bg);color:var(--warn-ink)}
.dot{width:7px;height:7px;border-radius:4px;background:currentColor;display:block}
.avatar{width:34px;height:34px;border-radius:17px;border:0;background:var(--ink);color:var(--gold);font-family:var(--display);font-size:12px;font-weight:500}
.tabs{display:flex;gap:4px;padding:0 12px 8px}
.tab{flex:1;height:38px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:var(--ink);color:#fff}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

/* cards & buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.flat{padding:0;overflow:hidden}
.card.miss{border-color:var(--red);box-shadow:0 0 0 2px rgba(196,18,26,.12)}
.btn{height:48px;padding:0 16px;border-radius:14px;border:1px solid #D9D5CE;background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.block{width:100%} .btn.big{height:56px;font-size:16px}
.btn.sm{height:36px;font-size:13px;padding:0 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--red-ink);font-weight:600;font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}

/* options */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opt{height:46px;border-radius:12px;border:1px solid #D9D5CE;background:var(--surface);font-family:var(--display);font-size:19px;font-weight:500}
.opt.txt{font-family:var(--font);font-size:14px;height:44px;border-radius:10px}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1px solid #D9D5CE;background:var(--surface);font-size:13px;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.follow{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.follow-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--gold-ink)}
.q{font-size:13px;font-weight:500;margin-bottom:6px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok-ink)} .b-warn{background:var(--warn-bg);color:var(--warn-ink)}
.b-flag{background:var(--flag-bg);color:var(--flag-ink)} .b-gold{background:#F7E9D2;color:var(--gold-ink)}
.b-grey{background:var(--line2);color:var(--ink2)}

/* store */
.store-top{height:4px;background:var(--brand)}
.store-body{padding:16px 16px 14px}
.store-name{font-size:26px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line2)}
.fact{padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.fact+.fact{border-left:1px solid var(--line2)}
.ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico.ok{background:var(--ok-bg);color:var(--ok)} .ico.warn{background:var(--warn-bg);color:var(--warn-ink)} .ico.grey{background:var(--bg);color:var(--ink2)}
.fact b{display:block;font-size:13px} .fact span{font-size:12px;color:var(--ink3)}

/* steps */
.steps{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stepbtn{height:52px;border:0;border-radius:10px;background:transparent;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.stepbtn b{font-size:13px;font-weight:600} .stepbtn span{font-family:var(--display);font-size:12px}
.stepbtn.on{background:var(--ink);color:#fff} .stepbtn.on span{color:var(--gold)}
.stepbtn.done span{color:var(--ok-ink)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .25s}

/* list items */
.item{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.dist{font-family:var(--display);font-size:14px;font-weight:500;white-space:nowrap}

/* photos */
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#2A2826}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.addph{aspect-ratio:3/4;border-radius:12px;border:1.5px dashed #C9C4BC;background:#FAF9F7;color:var(--red-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.addph i{width:44px;height:44px;border-radius:22px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}

.switch{width:52px;height:32px;border-radius:16px;border:0;background:#CFCAC2;padding:3px;display:flex;justify-content:flex-start;flex-shrink:0}
.switch[aria-checked="true"]{background:var(--ink);justify-content:flex-end}
.switch i{width:26px;height:26px;border-radius:13px;background:#fff;display:block}

input[type=text],input[type=password],input[type=search],textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid #C9C4BC;background:var(--surface);padding:10px 12px;font-size:15px}
textarea{min-height:76px;resize:vertical}
label.lb{display:block;font-size:13px;font-weight:600;margin-bottom:6px}

.footer-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:4}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink3)}
.alert{border-radius:12px;padding:12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-bg);color:var(--warn-ink)} .alert.flag{background:var(--flag-bg);color:var(--flag-ink)} .alert.ok{background:var(--ok-bg);color:var(--ok-ink)} .alert.info{background:#EAF1FB;color:#1D4E89}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line2)}
th{font-size:12px;color:var(--ink3);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
pre.json{margin:0;background:#1B1A19;color:#EDE9E3;border-radius:12px;padding:12px;font-size:11px;line-height:1.5;overflow:auto;max-height:320px}
.log{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#1B1A19;color:#EDE9E3;border-radius:12px;padding:10px 12px;max-height:220px;overflow:auto}
.log div{padding:2px 0}
.log .ok{color:#8FD6AE} .log .dup{color:#F2C46D}
.users{display:grid;gap:8px}
.ucard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.ucard[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ucard .avatar{flex-shrink:0}
.note{font-size:11px;color:var(--ink3);text-align:center;padding:16px 16px 24px}

/* toast & modal */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);max-width:400px;width:calc(100% - 32px);background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;z-index:40;background:#0E0D0C;display:flex;justify-content:center}
.modal[hidden]{display:none}
.cam{width:100%;max-width:440px;display:flex;flex-direction:column;color:#fff}
.cam-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600}
.cam-view{flex:1;position:relative;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam-view video,.cam-view canvas{width:100%;height:100%;object-fit:cover}
.cam-bar{height:120px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px}
.shutter{width:72px;height:72px;border-radius:36px;border:4px solid #fff;background:var(--brand)}
.cam-note{margin:0;padding:0 16px 18px;text-align:center;font-size:12px;color:#BDB7AE}
.ghost-dark{height:44px;border-radius:12px;border:1px solid #4A4642;background:transparent;color:#fff;padding:0 14px;justify-self:start}
@media (min-width:900px){ body{padding:24px 0} .app{min-height:calc(100vh - 48px);border-radius:24px;overflow:hidden} }
.opt.txt.tall{height:auto;min-height:44px;padding:8px 10px;line-height:1.3}
.missrow{background:var(--flag-bg);margin:0 -14px;padding-left:14px!important;padding-right:14px!important}
.card table th{width:42%;font-weight:500}
/* ---- v3 additions ---- */
select,input[type=date]{width:100%;min-height:44px;border-radius:12px;border:1px solid #C9C4BC;background:var(--surface);padding:8px 10px;font:inherit;font-size:14px;color:var(--ink);margin-top:4px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:75px;background:#2A2826}
.hero>*{position:relative;z-index:1}
.hero-eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--gold)}
.hero-num{font-family:var(--display);font-size:42px;font-weight:600;line-height:1.1}
.hero-of{font-family:var(--display);font-size:18px;color:#B9B4AC}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero-stats div{background:#2A2826;border-radius:12px;padding:8px 12px}
.hero-stats b{display:block;font-family:var(--display);font-size:20px}
.hero-stats span{font-size:11px;color:#CFCAC2}
.detect{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tier{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.tier.ok{background:var(--ok-bg);color:var(--ok-ink)} .tier.warn{background:var(--warn-bg);color:var(--warn-ink)} .tier.lock{background:var(--flag-bg);color:var(--flag-ink)}
.tier svg{flex-shrink:0;margin-top:2px}
.lockcard{align-items:center;text-align:center;padding:24px 18px;border-color:#E9B9B9}
.firstvisit{border-color:var(--gold-line);background:#FFFDF8}
.cam-view .oval{position:absolute;left:50%;top:44%;width:58%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:3px dashed rgba(230,191,138,.9);border-radius:50%;pointer-events:none}
.approvals{border-color:var(--gold-line)}
.appr{display:flex;gap:12px;border-top:1px solid var(--line2);padding-top:10px}
.appr img{width:64px;height:84px;object-fit:cover;border-radius:10px;flex-shrink:0;background:#2A2826}
.verbar{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;background:var(--ok-bg);color:var(--ok-ink)}
.verbar.dirty{background:var(--warn-bg);color:var(--warn-ink)}
.atabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.atabs button{flex-shrink:0;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink2)}
.atabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bgrid{display:grid;gap:8px}
.builder{border:2px solid var(--ink)}
.frow{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line2);padding-top:10px}
.frow.expired{opacity:.55} .frow.scheduled{background:#FFFDF8;margin:0 -14px;padding:10px 14px 0}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.ibtn.del{color:var(--flag-ink)}
.mtable td,.mtable th{vertical-align:top}
.mtable tr.sel td{background:#FBF4E8}
.tree{font-size:13px;background:#FAF9F7;border:1px solid var(--line);border-radius:12px;padding:12px}
.tree .tn{display:inline-block;background:var(--surface);border:1px solid #D9D5CE;border-radius:10px;padding:6px 10px;font-weight:600;margin:4px 0}
.tree .tn.r{border-color:var(--gold-line);background:var(--gold-bg);color:var(--gold-ink)}
.tree code{font-size:10px;color:var(--ink3);font-weight:500;margin-left:4px}
.tree .tb{margin-left:14px;padding-left:12px;border-left:2px solid #D9D5CE;margin-top:4px}
.tree .ta{display:inline-block;font-size:11px;font-weight:600;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;margin-right:6px}
.diff{font-size:13px;padding:6px 10px;border-radius:8px}
.diff.add{background:var(--ok-bg)} .diff.del{background:var(--flag-bg)}
.kof{font-size:15px;color:var(--ink3);font-weight:500}
.legend{display:flex;gap:10px;font-size:11px;color:var(--ink3)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.chart .col{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px}
.chart .col.on{background:var(--gold-bg)}
.chart .bars{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.chart .bars i{width:11px;border-radius:4px 4px 0 0;display:block;min-height:2px}
.chart .bars .p{background:#D9D5CE} .chart .bars .a{background:var(--red)}
.chart .cv{font-family:var(--display);font-size:12px} .chart .cd{font-size:11px;color:var(--ink3)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal" id="modal" hidden></div>
<div id="toast-root" aria-live="polite"></div>

/* =============================================================
   3) ภาพจำลอง (ใช้เมื่อไม่มีกล้อง) + ประทับเวลา/พิกัดลงภาพ
   ============================================================= */
function drawShelf(ctx, w, h, seed) {
  const rnd = mulberry32(seed || Date.now());
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#3A3733'); g.addColorStop(1, '#22201E');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const cols = ['#ED1C24', '#ED1C24', '#E6BF8A', '#8C8780', '#6E8FA8', '#B9B4AC', '#C4121A', '#4F7A5E'];
  const rows = 4, rowH = h * 0.8 / rows;
  for (let r = 0; r < rows; r++) {
    const base = h * 0.08 + rowH * (r + 1);
    let x = w * 0.04;
    while (x < w * 0.94) {
      const pw = w * (0.05 + rnd() * 0.03), ph = rowH * (0.55 + rnd() * 0.3);
      ctx.fillStyle = cols[Math.floor(rnd() * cols.length)];
      ctx.fillRect(x, base - ph, pw, ph);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + pw * 0.15, base - ph * 0.7, pw * 0.7, ph * 0.18);
      x += pw + w * 0.008;
    }
    ctx.fillStyle = '#6A655F'; ctx.fillRect(0, base, w, h * 0.012);
    ctx.fillStyle = '#F2EFEA'; ctx.fillRect(w * 0.1, base + h * 0.014, w * 0.07, h * 0.02); // ป้ายราคา
    ctx.fillRect(w * 0.55, base + h * 0.014, w * 0.07, h * 0.02);
  }
}
function stamp(ctx, w, h, lines) {
  const bh = h * 0.12, fs = Math.max(11, Math.round(h * 0.03));
  ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0, h - bh, w, bh);
  ctx.fillStyle = '#fff'; ctx.font = `600 ${fs}px sans-serif`; ctx.textBaseline = 'middle';
  ctx.fillText(lines[0], w * 0.035, h - bh * 0.68);
  ctx.font = `${fs}px sans-serif`; ctx.fillText(lines[1], w * 0.035, h - bh * 0.3);
  ctx.textAlign = 'right'; ctx.fillStyle = '#E6BF8A'; ctx.font = `600 ${Math.round(fs * 0.8)}px sans-serif`;
  ctx.fillText('SCOTCH FIELD AUDIT', w * 0.965, h - bh * 0.68); ctx.textAlign = 'left';
}
function makePhoto(source, meta, seed) {
  // source = <video> หรือ null (ภาพจำลอง)
  let w = 720, h = 960;
  if (source && source.videoWidth) { const s = Math.min(1, 1024 / Math.max(source.videoWidth, source.videoHeight)); w = Math.round(source.videoWidth * s); h = Math.round(source.videoHeight * s); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (source && source.videoWidth) ctx.drawImage(source, 0, 0, w, h); else drawShelf(ctx, w, h, seed);
  stamp(ctx, w, h, [`${meta.label ? meta.label + ' · ' : ''}${fmtDT(meta.takenAt)} · สาขา ${meta.store}`, `${meta.lat.toFixed(5)}, ${meta.lng.toFixed(5)}  ±${Math.round(meta.acc)} ม.`]);
  const data = c.toDataURL('image/jpeg', 0.72);
  return { data, takenAt: meta.takenAt, lat: meta.lat, lng: meta.lng, kb: Math.round(data.length * 0.75 / 1024) };
}

/* =============================================================
   2) แบบฟอร์ม: คลังคำถาม (master) + แถวในฟอร์ม + การเผยแพร่

const OTHER = 'OTH', OTHER_OPT = 'อื่นๆ';
const clone = x => JSON.parse(JSON.stringify(x));
const iso = d => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const TODAY = iso(new Date());
const TH_MONTH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const fmtD = s => { const d = new Date(s + 'T00:00:00'); return `${d.getDate()} ${TH_MONTH[d.getMonth()]}`; };
const PERIOD = (() => { const d = new Date(); return `${TH_MONTH[d.getMonth()]} ${d.getFullYear()}`; })();

const QM = clone(SEED.questions);                    // คลังคำถาม (master)
const qBy = id => QM.find(q => q.id === id);
const MSL_QS = QM.filter(q => q.cat === 'Must List');
const CATS = ['Must List', 'เช็คสินค้าทั่วไป', 'กระเช้า', 'สื่อโปรโมชั่น', 'พื้นที่พิเศษ'];
let rowSeq = 0;
const newRowId = () => 'R' + String(++rowSeq).padStart(3, '0');
function buildRows() {
  const rows = [];
  SEED.formRows.forEach(spec => {
    (spec.products || [null]).forEach(p => rows.push({ id: newRowId(), q: spec.q, product: p, start: addDays(spec.from), end: addDays(spec.to) }));
  });
  return rows;
}
// PUB = ฟอร์มที่เผยแพร่แล้ว (FF เห็น) · DRAFT = ฉบับที่ Admin กำลังแก้
let PUB = { version: SEED.form.version, rows: buildRows(), reasons: clone(SEED.reasons), at: addDays(-16) };
let DRAFT = clone(PUB);
const isDirty = () => JSON.stringify({ r: DRAFT.rows, s: DRAFT.reasons }) !== JSON.stringify({ r: PUB.rows, s: PUB.reasons });
const rowStatus = r => TODAY < r.start ? 'scheduled' : TODAY > r.end ? 'expired' : 'live';
const liveRows = () => PUB.rows.filter(r => rowStatus(r) === 'live');
const rowKey = r => r.q + ':' + (r.product || '-');           // กุญแจคำตอบ = รหัสคำถาม + รหัสสินค้า (คงที่ทุกเดือน)
const stepOfRow = r => r.q === 'MSL' ? 'msl' : qBy(r.q).cat === 'เช็คสินค้าทั่วไป' ? 'other' : 'area';
const rowsOf = step => liveRows().filter(r => stepOfRow(r) === step);
const reasonList = kind => PUB.reasons[kind].filter(r => r.active);
const reasonLabel = (kind, code, other) => code === OTHER ? 'อื่น ๆ: ' + (other || '') : ((PUB.reasons[kind].find(r => r.code === code) || {}).label || code || '');

const SLOT = { sign: 'ป้ายหน้าสาขา', selfie: 'Selfie ยืนยันตัวตน', cooler: 'หน้าเชลฟ์ (ตู้แช่ขวดเดี่ยว)' };
I.finger = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11v4"/><path d="M8.5 7.5A5 5 0 0 1 17 11v2a9 9 0 0 1-1 4"/><path d="M7 11a5 5 0 0 1 .3-1.7"/><path d="M7 14v-3"/><path d="M9 18.5a9 9 0 0 0 1.5-4.5"/><path d="M5 6.5A8 8 0 0 1 19.5 9"/></svg>';

STORES.forEach(s => { s.status = 'active'; });

/* ระยะจากร้าน 3 ระดับ: ok / selfie / lock */
function tierOf(pos, st) {
  const d = haversine(pos, st);
  if (d > RULES.lockM) return { k: 'lock', d };
  if (d > RULES.okM || pos.acc > RULES.okAccM) return { k: 'selfie', d };
  return { k: 'ok', d };
}

/* =============================================================
   3) "SERVER" จำลอง — สิ่งที่ API จริงจะทำเมื่อได้รับข้อมูล
   ============================================================= */
function serverReceive(v, receivedAt) {
  if (S.server.some(x => x.id === v.id)) return { status: 200, note: 'ซ้ำ → ข้าม (ไม่บันทึกซ้ำ)' };
  const rec = clone(v);
  rec.receivedAt = (receivedAt || new Date()).toISOString();
  const st = storeBy(v.store);
  rec.distance = Math.round(haversine({ lat: v.lat, lng: v.lng }, st));   // server คำนวณเอง ไม่เชื่อค่าจากมือถือ
  const flags = [];
  const dur = (new Date(v.completedAt) - new Date(v.surveyStartedAt || v.startedAt)) / 1000;   // เวลาทำแบบสอบถามจริง
  const late = (new Date(rec.receivedAt) - new Date(v.completedAt)) / 3600000;
  if (rec.distance > RULES.okM) flags.push(`เช็คอินห่างร้าน ${fmtDist(rec.distance)} (มี selfie)`);
  if (dur < RULES.minDurationSec) flags.push(`ใช้เวลาเพียง ${fmtDur(dur)} นาที`);
  if (late > RULES.lateHours) flags.push(`ส่งย้อนหลัง ${late.toFixed(1)} ชม.`);
  if (v.acc > RULES.okAccM) flags.push(`GPS ไม่แม่นยำ (±${Math.round(v.acc)} ม.)`);
  rec.flags = flags;
  if (v.profileLoc && !st.loc) st.loc = v.profileLoc;    // ข้อมูลพื้นที่ใกล้เคียง เก็บถาวรใน master สาขา
  S.server.push(rec);
  return { status: 201, note: flags.length ? `รับแล้ว · flag ${flags.length}` : 'รับแล้ว' };
}

/* =============================================================
   4) ข้อมูลตัวอย่างของวันนี้
   ============================================================= */
function newVisit(user, store, start, pos) {
  return { id: uuid(), user, store, startedAt: start.toISOString(), completedAt: null,
    lat: pos.lat, lng: pos.lng, acc: pos.acc,
    purpose: null, coverFor: '', access: null, accessReason: '', shelfSize: null, profileLoc: null,
    surveyStartedAt: null, surveyLat: null, surveyLng: null, surveyAcc: null,   // กด "เริ่มตอบแบบสอบถาม"
    ans: {},                                   // คำตอบทั้งหมด: key = รหัสคำถาม:รหัสสินค้า
    cooler: null, photos: { sign: [], selfie: [], cooler: [] }, remark: '', formVersion: PUB.version };
}
function drawSelfie(ctx, w, h, seed) {
  const rnd = mulberry32(seed || 7);
  drawShelf(ctx, w, h, seed);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, w, h);
  const skin = ['#C68E68', '#B97D5A', '#D7A27F'][Math.floor(rnd() * 3)];
  ctx.fillStyle = ['#ED1C24', '#2F4A6D', '#3B6B4F'][Math.floor(rnd() * 3)];
  ctx.beginPath(); ctx.ellipse(w / 2, h * 0.98, w * 0.42, h * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = skin; ctx.fillRect(w * 0.45, h * 0.55, w * 0.1, h * 0.12);
  ctx.beginPath(); ctx.ellipse(w / 2, h * 0.45, w * 0.17, h * 0.15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#231F1C'; ctx.beginPath(); ctx.ellipse(w / 2, h * 0.36, w * 0.18, h * 0.08, 0, Math.PI, 0); ctx.fill();
}
function photoOf(slot, meta, seed, src) {
  if (slot === 'selfie' && !(src && src.videoWidth)) {
    const c = document.createElement('canvas'); c.width = 720; c.height = 960;
    const ctx = c.getContext('2d'); drawSelfie(ctx, 720, 960, seed);
    stamp(ctx, 720, 960, [`${SLOT.selfie} · ${fmtDT(meta.takenAt)} · สาขา ${meta.store}`, `${meta.lat.toFixed(5)}, ${meta.lng.toFixed(5)}  ±${Math.round(meta.acc)} ม.`]);
    const data = c.toDataURL('image/jpeg', 0.72);
    return { data, takenAt: meta.takenAt, lat: meta.lat, lng: meta.lng, kb: Math.round(data.length * 0.75 / 1024) };
  }
  return makePhoto(src || null, Object.assign({ label: SLOT[slot] }, meta), seed);
}
function randomAnswers(v, rnd) {
  const pick = a => a[Math.floor(rnd() * a.length)];
  liveRows().forEach(r => {
    const k = rowKey(r);
    if (r.q === 'MSL') {
      const a = v.ans[k] = { shelf: rnd() < .68 ? 'มี' : 'ไม่มี' };
      if (a.shelf === 'ไม่มี') {
        a.stock = rnd() < .5 ? 'มี' : 'ไม่มี';
        if (a.stock === 'มี') { a.arrange = rnd() < .75 ? 'ให้จัด' : 'ไม่ให้จัด'; if (a.arrange === 'ไม่ให้จัด') a.arrangeReason = pick(reasonList('arrange')).code; }
        else { a.order = rnd() < .55 ? 'สั่ง' : 'ไม่สั่ง'; if (a.order === 'ไม่สั่ง') a.orderReason = pick(reasonList('order')).code; }
      }
      return;
    }
    const q = qBy(r.q), a = v.ans[k] = { value: rnd() < .55 ? q.options[0] : q.options[q.options.length - 1], multi: {}, other: {} };
    if (q.follow && a.value === q.follow.on) q.follow.qs.forEach(cid => {
      const opts = qBy(cid).options.filter(o => o !== OTHER_OPT);
      a.multi[cid] = opts.filter(() => rnd() < .45); if (!a.multi[cid].length) a.multi[cid] = [opts[0]];
    });
  });
}
function seedToday() {
  const rnd = mulberry32(2027);
  const ffs = USERS.filter(u => u.role === 'FF');
  const base = new Date(Date.now() - (10 * 26 + 30) * 60000);
  const order = ['250', '2512', '15894', '1696', '949', '1764', '3755', '906', '10', '45'];
  for (let i = 0; i < 10; i++) {
    const u = ffs[i % ffs.length], st = storeBy(order[i]);
    const start = new Date(base.getTime() + i * 26 * 60000);
    let durMin = 9 + Math.floor(rnd() * 8), lag = 1 + Math.floor(rnd() * 20);
    let off = { lat: (rnd() - .5) * 0.0003, lng: (rnd() - .5) * 0.0003 };
    if (i === 3) durMin = 2.4;
    if (i === 6) off = { lat: 0.0009, lng: 0.0006 };      // ~120 ม. → ต้อง selfie
    if (i === 8) lag = 5 * 60 + 10;
    const v = newVisit(u.code, st.code, start, { lat: st.lat + off.lat, lng: st.lng + off.lng, acc: 6 + Math.round(rnd() * 10) });
    const meta = k => ({ takenAt: new Date(start.getTime() + (1 + k) * 60000).toISOString(), store: st.code, lat: v.lat, lng: v.lng, acc: v.acc });
    v.purpose = i === 5 ? 'เข้าแทน' : i === 2 ? 'ติดตามงาน' : 'เข้าตามปกติ';
    if (v.purpose === 'เข้าแทน') v.coverFor = ffs[(i + 1) % ffs.length].code;
    v.photos.sign.push(photoOf('sign', meta(0), 300 + i));
    if (i === 6) v.photos.selfie.push(photoOf('selfie', meta(0), 500 + i));
    if (i === 4) { v.access = 'out'; v.accessReason = 'สาขาปิดปรับปรุง'; durMin = 3.5; }
    else {
      v.access = 'in'; v.shelfSize = pick3(rnd, SEED.shelfSizes.slice(1, 4));
      randomAnswers(v, rnd);
      v.cooler = i === 7 ? SEED.coolerOptions[2] : i === 2 ? SEED.coolerOptions[1] : SEED.coolerOptions[0];
      if (v.cooler !== SEED.coolerOptions[2]) v.photos.cooler.push(photoOf('cooler', meta(6), 99 + i));
    }
    if (v.access === 'in') Object.assign(v, { surveyStartedAt: new Date(start.getTime() + 2 * 60000).toISOString(), surveyLat: v.lat, surveyLng: v.lng, surveyAcc: v.acc });
    v.completedAt = new Date(start.getTime() + (durMin + (v.access === 'in' ? 2 : 0)) * 60000).toISOString();
    serverReceive(v, new Date(new Date(v.completedAt).getTime() + lag * 60000));
  }
  // รายการรออนุมัติ: ร้านใหม่ 1 + แจ้งร้านปิด 1
  const ns = { code: 'N-0001', name: 'ซอยโชคชัย 4 (ร้านใหม่)', fc: 'BE', loc: null, lat: 13.79120, lng: 100.60420, status: 'pending' };
  STORES.push(ns);
  S.reports.push({ id: uuid(), type: 'new', store: ns.code, user: 'CVSBKK14', at: new Date(Date.now() - 95 * 60000).toISOString(), note: 'เปิดใหม่ปากซอย', photo: photoOf('sign', { takenAt: new Date().toISOString(), store: 'N-0001', lat: ns.lat, lng: ns.lng, acc: 9 }, 41).data, status: 'pending' });
  storeBy('2512').status = 'closing';
  S.reports.push({ id: uuid(), type: 'closed', store: '2512', user: 'CVSBKK14', at: new Date(Date.now() - 40 * 60000).toISOString(), note: 'ป้ายแจ้งปิดกิจการถาวร', photo: photoOf('sign', { takenAt: new Date().toISOString(), store: '2512', lat: 13.758, lng: 100.6455, acc: 7 }, 77).data, status: 'pending' });
}
function pick3(rnd, a) { return a[Math.floor(rnd() * a.length)]; }

/* =============================================================
   5) ตำแหน่ง (GPS จริง หรือจำลอง)

function setPosMode(m) {
  S.posMode = m;
  const home = storeBy('10');
  if (m === 'store') S.pos = { lat: home.lat + 0.00009, lng: home.lng + 0.00007, acc: 7, src: 'จำลอง: ยืนหน้าร้าน ลาดพร้าว 101' };
  else if (m === 'near') S.pos = { lat: home.lat - 0.00095, lng: home.lng - 0.0004, acc: 12, src: 'จำลอง: ห่างร้าน ~110 ม.' };
  else if (m === 'far') S.pos = { lat: home.lat + 0.0088, lng: home.lng + 0.0046, acc: 14, src: 'จำลอง: ห่างร้าน ~1 กม.' };
  else {
    S.pos = null;
    if (!navigator.geolocation) { toast('เบราว์เซอร์นี้ไม่รองรับ GPS — กลับไปใช้ตำแหน่งจำลอง'); return setPosMode('store'); }

      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  }
  render();
}

/* =============================================================
   6) ขั้นตอน + ตรวจความครบถ้วน
   ============================================================= */
function steps(v) {
  return v && v.access === 'out'
    ? [{ k: 'checkin', l: 'เช็คอิน' }]
    : [{ k: 'checkin', l: 'เช็คอิน' }, { k: 'msl', l: 'Must List' }, { k: 'other', l: 'สินค้าอื่น' }, { k: 'area', l: 'พื้นที่/สื่อ' }, { k: 'photo', l: 'รูปเชลฟ์' }];
}
function checkinItems(v) {
  const st = storeBy(v.store), t = tierOf(v, st);
  const it = [
    ['lock', t.k !== 'lock'],
    ['sign', v.photos.sign.length > 0],
    ['purpose', !!v.purpose && (v.purpose !== 'เข้าแทน' || !!v.coverFor)],
    ['access', !!v.access && (v.access !== 'out' || !!v.accessReason.trim())]
  ];
  if (t.k === 'selfie') it.push(['selfie', v.photos.selfie.length > 0]);
  if (v.access === 'in') { it.push(['shelf', !!v.shelfSize]); if (!st.loc) it.push(['profile', !!v.profileLoc]); }
  return it;
}
function mslMissing(a) {
  a = a || {};
  if (!a.shelf) return true;
  if (a.shelf === 'ไม่มี') {
    if (!a.stock) return true;
    if (a.stock === 'มี') { if (!a.arrange) return true; if (a.arrange === 'ไม่ให้จัด' && (!a.arrangeReason || (a.arrangeReason === OTHER && !(a.arrangeOther || '').trim()))) return true; }
    if (a.stock === 'ไม่มี') { if (!a.order) return true; if (a.order === 'ไม่สั่ง' && (!a.orderReason || (a.orderReason === OTHER && !(a.orderOther || '').trim()))) return true; }
  }
  return false;
}
function qMissing(r, a) {
  const q = qBy(r.q); a = a || {};
  if (q.type === 'multiple') return !(a.multi && a.multi[q.id] && a.multi[q.id].length);
  if (!a.value) return true;
  if (q.follow && a.value === q.follow.on) return q.follow.qs.some(cid => {
    const sel = (a.multi || {})[cid] || [];
    return !sel.length || (sel.includes(OTHER_OPT) && !((a.other || {})[cid] || '').trim());
  });
  return false;
}
const rowMissing = (v, r) => r.q === 'MSL' ? mslMissing(v.ans[rowKey(r)]) : qMissing(r, v.ans[rowKey(r)]);
function missing(v) {
  const m = {
    checkin: checkinItems(v).filter(x => !x[1]).length,
    msl: rowsOf('msl').filter(r => rowMissing(v, r)).length,
    other: rowsOf('other').filter(r => rowMissing(v, r)).length,
    area: rowsOf('area').filter(r => rowMissing(v, r)).length,
    photo: !v.cooler ? 1 : (v.cooler !== SEED.coolerOptions[2] && !v.photos.cooler.length ? 1 : 0)
  };
  if (v.access === 'out') m.msl = m.other = m.area = m.photo = 0;
  return m;
}
const totals = v => ({ checkin: checkinItems(v).length, msl: rowsOf('msl').length, other: rowsOf('other').length, area: rowsOf('area').length, photo: 1 });

/* =============================================================
   7) ACTIONS — ทุกปุ่มมี data-act="ชื่อ"
   ============================================================= */

  },

  },
  purpose(d) { S.visit.purpose = d.v; if (d.v !== 'เข้าแทน') S.visit.coverFor = ''; render(); },

  cooler(d) { S.visit.cooler = d.v; if (d.v === SEED.coolerOptions[2]) S.visit.photos.cooler = []; render(); },
  step(d) { S.step = +d.n; render(); window.scrollTo(0, 0); },
  next() {
    const v = S.visit;

      const miss = missing(v).checkin;
      if (miss) { S.showMissing = true; render(); return toast(`ข้อมูลเช็คอินยังไม่ครบ ${miss} รายการ`); }
      if (!v.surveyStartedAt) {           // กด "เริ่มตอบแบบสอบถาม" → บันทึกเวลาเริ่ม + จับ GPS อีกครั้ง
        const pos = S.pos || v, t = tierOf(pos, storeBy(v.store));
        if (t.k === 'lock') return toast(`ตอนนี้อยู่ห่างร้าน ${fmtDist(t.d)} — เริ่มทำแบบสอบถามไม่ได้`);
        Object.assign(v, { surveyStartedAt: new Date().toISOString(), surveyLat: pos.lat, surveyLng: pos.lng, surveyAcc: pos.acc });
        toast(`เริ่มจับเวลาแบบสอบถาม ${fmtTime(v.surveyStartedAt)} น. · GPS ห่างร้าน ${fmtDist(t.d)}`);

  },
  prev() { S.step = Math.max(0, S.step - 1); render(); window.scrollTo(0, 0); },
  camera(d) { openCamera(d.slot, d.target || 'visit'); },

  camShot() {

    const meta = { takenAt: new Date().toISOString(), store: holder.store || (S.draft && S.draft.code) || 'ใหม่', lat: S.pos.lat, lng: S.pos.lng, acc: S.pos.acc };

  },
  delPhoto(d) { (d.target === 'draft' ? S.draft : S.visit).photos[d.slot].splice(+d.i, 1); render(); },
  submit() {

    <div class="cam-bar"><button class="ghost-dark" data-act="camClose">ยกเลิก</button><button class="shutter" data-act="camShot" aria-label="ถ่ายรูป"></button><span></span></div>
    <p class="cam-note">${selfie ? 'วางหน้าให้อยู่ในกรอบ ให้เห็นฉากหน้าร้าน · ' : slot === 'cooler' ? 'ถ่ายหลังจัดเรียงแล้ว · ' : ''}ไม่มีปุ่มเลือกรูปจากอัลบั้ม · เวลาและพิกัดถูกประทับลงรูป</p></div>`;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-api');
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: selfie ? 'user' : 'environment' }, width: { ideal: 1280 } }, audio: false });
    document.getElementById('cam-video').srcObject = camStream; camSim = false; mode.textContent = selfie ? 'กล้องหน้า' : 'กล้องจริง';
  } catch (e) {
    camSim = true; mode.textContent = 'โหมดจำลอง (ไม่พบกล้อง/ไม่ได้รับอนุญาต)';
    document.getElementById('cam-video').hidden = true;

  }
}

}

/* =============================================================
   9) EXPORT CSV — คอลัมน์ผูกกับ "รหัสคำถาม + รหัสสินค้า" (ต่อผลข้ามเดือนได้)
   ============================================================= */
function csvCell(x) {
  let s = String(x == null ? '' : x);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // กัน CSV/Formula injection
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv() {
  const keys = []; const seen = new Set();
  [...PUB.rows, ...S.server.flatMap(v => Object.keys(v.ans).map(k => ({ q: k.split(':')[0], product: k.split(':')[1] === '-' ? null : k.split(':')[1] })))]
    .forEach(r => { const k = rowKey(r); if (!seen.has(k)) { seen.add(k); keys.push(r); } });
  const head = ['VisitId', 'Check-in time', 'Survey start', 'Completion time', 'Received at server', 'รหัสสาขา', 'ชื่อสาขา', 'Group', 'เขต', 'จุดประสงค์', 'เข้าแทน', 'การเยี่ยมสาขา', 'เหตุผลที่เข้าไม่ได้', 'ขนาดพื้นที่เชลฟ์', 'ประเภทที่ตั้ง', 'Form version'];
  const cols = [];
  keys.forEach(r => {
    const prod = r.product ? prodBy(r.product) : null, tag = prod ? `[${prod.code}]` : '';
    if (r.q === 'MSL') MSL_QS.forEach(q => cols.push({ h: `${q.key} ${tag}`, f: v => { const a = v.ans[rowKey(r)] || {};
      return { ON_SHELF: a.shelf, IN_STOCK: a.stock, ALLOW_ARRANGE: a.arrange, ARRANGE_REASON: a.arrangeReason ? reasonLabel('arrange', a.arrangeReason, a.arrangeOther) : '', WILL_ORDER: a.order, ORDER_REASON: a.orderReason ? reasonLabel('order', a.orderReason, a.orderOther) : '' }[q.key] || ''; } }));
    else {
      const q = qBy(r.q);
      cols.push({ h: `${q.key} ${tag}`.trim(), f: v => (v.ans[rowKey(r)] || {}).value || '' });
      ((q.follow || {}).qs || []).forEach(cid => cols.push({ h: qBy(cid).key, f: v => { const a = v.ans[rowKey(r)] || {}; return [...((a.multi || {})[cid] || []).filter(x => x !== OTHER_OPT), (a.other || {})[cid] ? 'อื่นๆ: ' + a.other[cid] : ''].filter(Boolean).join('; '); } }));
    }
  });
  const tail = ['ถ่ายรูปตู้แช่ได้หรือไม่', 'รูปป้าย', 'Selfie', 'รูปตู้แช่', 'หมายเหตุ', 'Latitude', 'Longitude', 'ระยะห่างจากร้าน (ม.)', 'Flag'];
  const rows = S.server.slice().sort((a, b) => a.startedAt.localeCompare(b.startedAt)).map(v => {
    const u = userBy(v.user), st = storeBy(v.store);
    return [v.id, fmtDT(v.startedAt), v.surveyStartedAt ? fmtDT(v.surveyStartedAt) : '', fmtDT(v.completedAt), fmtDT(v.receivedAt), st.code, st.name, u.group, `${u.code} ${u.name}`, v.purpose, v.coverFor, v.access === 'in' ? 'เข้าได้' : 'เข้าไม่ได้', v.accessReason, v.shelfSize || '', st.loc || v.profileLoc || '', 'v' + v.formVersion,
      ...cols.map(c => c.f(v)),
      v.cooler || '', v.photos.sign.length, v.photos.selfie.length, v.photos.cooler.length, v.remark, v.lat.toFixed(6), v.lng.toFixed(6), v.distance, v.flags.join(' | ')];
  });
  const all = [[...head, ...cols.map(c => c.h), ...tail], ...rows];
  const csv = '﻿' + all.map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `FieldAudit_${TODAY}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast(`ส่งออก ${rows.length} แถว × ${all[0].length} คอลัมน์ — หัวคอลัมน์เป็นรหัสคำถาม ต่อผลข้ามเดือนได้`);
}

    <section class="card stack"><div class="between"><h2 style="font-size:16px">รูปหน้าร้าน (หลักฐาน) *</h2></div>${photoGrid(d, 'sign', 'draft')}
      <div><label class="lb" for="cl-note">หมายเหตุ</label><input id="cl-note" type="text" data-draft="note" maxlength="120" value="${esc(d.note)}" placeholder="เช่น มีป้ายแจ้งปิดกิจการ"></div></section>
    <button class="btn primary big block" data-act="closedSave">ส่งแจ้งร้านปิด</button>
  </main>`;
}

function vAudit() {
  const v = S.visit, st = storeBy(v.store);
  const t = tierOf(v, st);
  const stp = steps(v); if (S.step >= stp.length) S.step = stp.length - 1;
  const miss = missing(v), tot = totals(v);
  const doneSum = stp.reduce((a, s) => a + (tot[s.k] - miss[s.k]), 0), totSum = stp.reduce((a, s) => a + tot[s.k], 0);
  const pct = Math.round(doneSum / Math.max(1, totSum) * 100);
  const cur = stp[S.step].k;
  const body = { checkin: stepCheckin, msl: stepMsl, other: stepOther, area: stepArea, photo: stepPhoto }[cur](v);
  const nextL = stp[S.step + 1] ? stp[S.step + 1].l : '';
  const locked = t.k === 'lock';
  return `<main class="main" style="padding-bottom:8px">
    <section class="card flat" aria-label="ข้อมูลสาขา">
      <div class="store-top"></div>
      <div class="store-body">
        <div class="between"><div class="eyebrow">7-ELEVEN · รหัสสาขา ${esc(st.code)}${st.status === 'pending' ? ' · ร้านใหม่' : ''}</div><button class="btn sm" data-act="go" data-to="pick">เปลี่ยนสาขา</button></div>
        <h1 class="store-name">${esc(st.name)}</h1>
        <div class="muted small">FC ${esc(st.fc)} · ${esc(st.loc || 'ยังไม่มีข้อมูลพื้นที่')}</div>
      </div>
      <div class="facts">
        <div class="fact"><span class="ico ${t.k === 'ok' ? 'ok' : 'warn'}">${t.k === 'ok' ? I.pinok : I.pin}</span>
          <div><b style="color:${t.k === 'ok' ? 'var(--ok-ink)' : t.k === 'selfie' ? 'var(--warn-ink)' : 'var(--flag-ink)'}">${t.k === 'ok' ? 'อยู่ในรัศมีร้าน' : t.k === 'selfie' ? 'ต้อง selfie ยืนยัน' : 'นอกรัศมี · ล็อก'}</b><span>ห่างร้าน ${fmtDist(t.d)} · ±${Math.round(v.acc)} ม.</span></div></div>
        <div class="fact"><span class="ico grey">${I.clock}</span>
          <div><b>เช็คอิน ${fmtTime(v.startedAt)} น.</b><span>${v.surveyStartedAt ? `เริ่มตอบ ${fmtTime(v.surveyStartedAt)} · <span id="elapsed">${fmtDur((Date.now() - new Date(v.surveyStartedAt)) / 1000)}</span>` : 'ยังไม่เริ่มตอบแบบสอบถาม'}</span></div></div>
      </div>
    </section>
    <nav class="steps" style="grid-template-columns:repeat(${stp.length},minmax(0,1fr))" aria-label="ขั้นตอน">
      ${stp.map((s, i) => `<button class="stepbtn ${S.step === i ? 'on' : ''} ${miss[s.k] === 0 ? 'done' : ''}" data-act="step" data-n="${i}" ${(locked || !v.surveyStartedAt) && i > 0 ? 'disabled' : ''} ${S.step === i ? 'aria-current="step"' : ''}>
        <b>${s.l}</b><span>${miss[s.k] === 0 ? '✓' : (tot[s.k] - miss[s.k]) + '/' + tot[s.k]}</span></button>`).join('')}
    </nav>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="ความคืบหน้า"><i style="width:${pct}%"></i></div>
    ${body}
  </main>
  <div class="footer-bar">
    <div class="hint">${S.online ? I.cloud + 'บันทึกในเครื่องทันที · ส่งอัตโนมัติเมื่อกดส่ง' : I.wifiOff + 'ออฟไลน์อยู่ · ข้อมูลจะเก็บในเครื่องแล้วส่งภายหลัง'}</div>
    <div class="row">
      ${S.step > 0 ? `<button class="btn" style="flex:1" data-act="prev">${I.back} ย้อนกลับ</button>` : `<button class="btn" style="flex:1" data-act="go" data-to="home">ยกเลิก</button>`}
      ${S.step < stp.length - 1 ? `<button class="btn primary" style="flex:2" data-act="next" ${locked ? 'disabled' : ''}>${cur === 'checkin' && !v.surveyStartedAt ? I.clock + ' เริ่มตอบแบบสอบถาม' : 'ถัดไป · ' + nextL + ' ' + I.arrow}</button>`
        : `<button class="btn primary" style="flex:2" data-act="submit" ${locked ? 'disabled' : ''}>${I.check} เสร็จสิ้น</button>`}
    </div>
  </div>`;
}

/* ปุ่มตัวเลือกทั่วไป */
function opts(act, attrs, cur, list, cls) {
  return list.map(x => `<button class="opt txt ${cls || ''} ${cur === x ? 'on' : ''}" aria-pressed="${cur === x}" data-act="${act}" ${attrs} data-v="${esc(x)}">${esc(x)}</button>`).join('');
}
function chipsOf(act, attrs, sel, list) {
  return `<div class="chips">${list.map(x => { const on = sel.includes(x); return `<button class="chip ${on ? 'on' : ''}" aria-pressed="${on}" data-act="${act}" ${attrs} data-v="${esc(x)}">${esc(x)}</button>`; }).join('')}</div>`;
}

function stepCheckin(v) {
  const st = storeBy(v.store), t = tierOf(v, st), sm = S.showMissing;
  const items = Object.fromEntries(checkinItems(v));
  if (t.k === 'lock') return `<section class="card stack lockcard">
      <span class="ico" style="width:56px;height:56px;border-radius:28px;background:var(--flag-bg);color:var(--flag-ink)">${I.lock.replace(/14/g, '26')}</span>
      <h2 style="font-size:20px">เช็คอินไม่ได้ — อยู่ห่างร้าน ${fmtDist(t.d)}</h2>
      <div class="muted small">ต้องอยู่ห่างจากร้านไม่เกิน ${RULES.lockM} ม. (ในรัศมี ${RULES.okM} ม. เช็คอินได้ทันที) · ไปที่หน้าร้านแล้วกดอัปเดตตำแหน่ง</div>
      <button class="btn dark block" data-act="recheck">อัปเดตตำแหน่ง</button>
      <button class="btn block" data-act="simWalk">ทดสอบ: จำลองว่าเดินมาถึงหน้าร้านแล้ว</button>
    </section>`;
  const firstVisit = !st.loc;

  return `${tierBadge(t.k, t.d)}
    <section class="card stack ${sm && !items.sign ? 'miss' : ''}"><div class="between"><h2 style="font-size:17px">รูปป้ายหน้าสาขา (reference)</h2><span class="small muted">บังคับ</span></div>
      ${photoGrid(v, 'sign', 'visit')}
      <div class="small muted row" style="gap:6px">${I.lock} ต้องถ่ายจากในแอป · อัปโหลดจากอัลบั้มไม่ได้</div></section>
    ${t.k === 'selfie' ? `<section class="card stack ${sm && !items.selfie ? 'miss' : ''}"><div class="between"><h2 style="font-size:17px">Selfie ยืนยันตัวตน</h2><span class="badge b-warn">ห่างร้านเกิน ${RULES.okM} ม.</span></div>
      <div class="small muted">ใช้กล้องหน้า ให้เห็นหน้าและฉากหน้าร้าน</div>${photoGrid(v, 'selfie', 'visit')}</section>` : ''}
    <section class="card stack ${sm && !items.purpose ? 'miss' : ''}"><h2 style="font-size:17px">จุดประสงค์การเข้าร้าน</h2>
      <div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))">${opts('purpose', '', v.purpose, SEED.purposes)}</div>
      ${v.purpose === 'เข้าแทน' ? `<div class="follow"><div class="follow-h">${I.branch} เข้าแทนใคร?</div>
        <div class="chips">${others.map(u => `<button class="chip ${v.coverFor === u.code ? 'on' : ''}" aria-pressed="${v.coverFor === u.code}" data-act="cover" data-v="${esc(u.code)}">${esc(u.code)} ${esc(u.name)}</button>`).join('')}</div></div>` : ''}
    </section>
    <section class="card stack ${sm && !items.access ? 'miss' : ''}"><h2 style="font-size:17px">การเยี่ยมสาขา</h2>
      <div class="seg2">
        <button class="opt txt ${v.access === 'in' ? 'on' : ''}" aria-pressed="${v.access === 'in'}" data-act="access" data-v="in">เข้าได้</button>
        <button class="opt txt ${v.access === 'out' ? 'on' : ''}" aria-pressed="${v.access === 'out'}" data-act="access" data-v="out">เข้าไม่ได้</button></div>
      ${v.access === 'out' ? `<div class="follow"><div class="follow-h">${I.branch} เหตุผลที่เข้าไม่ได้ — แล้วกดบันทึกได้เลย</div>
        <div class="chips">${SEED.accessReasons.map(r => `<button class="chip ${v.accessReason === r ? 'on' : ''}" aria-pressed="${v.accessReason === r}" data-act="reasonChip" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div>
        <div><label class="lb" for="acc-reason">หรือพิมพ์เหตุผล</label><input id="acc-reason" type="text" data-bind="accessReason" maxlength="200" value="${esc(v.accessReason)}" placeholder="ระบุเหตุผล"></div></div>` : ''}
    </section>
    ${v.access === 'in' ? `<section class="card stack ${sm && !items.shelf ? 'miss' : ''}"><div class="between"><h2 style="font-size:17px">ขนาดพื้นที่เชลฟ์</h2><span class="small muted">ใส่ทุกครั้ง</span></div>
      <div class="seg2">${opts('shelf', '', v.shelfSize, SEED.shelfSizes)}</div></section>
    ${firstVisit ? `<section class="card stack firstvisit ${sm && !items.profile ? 'miss' : ''}"><div class="between"><h2 style="font-size:17px">พื้นที่ใกล้เคียงร้าน</h2><span class="badge b-gold">ครั้งแรกของสาขานี้</span></div>
      <div class="small muted">ตอบครั้งเดียว ระบบเก็บไว้ใน master สาขา ครั้งต่อไปไม่ต้องตอบ</div>
      ${chipsOf('profile', '', v.profileLoc ? [v.profileLoc] : [], SEED.locTypes)}</section>`
      : `<div class="small muted row" style="gap:6px;padding:0 4px">${I.check} พื้นที่ใกล้เคียง: <b>${esc(st.loc)}</b> (บันทึกไว้แล้ว)</div>`}` : ''}`;
}

function mslCard(v, r) {
  const p = prodBy(r.product), key = rowKey(r), a = v.ans[key] || {}, miss = S.showMissing && mslMissing(a), ok = !mslMissing(a);
  const at = `data-key="${esc(key)}"`;
  const reasonBlock = (kind, f, otherF) => `<div><div class="q">เพราะอะไร? <span class="muted">(${kind === 'arrange' ? 'ARRANGE_REASON' : 'ORDER_REASON'})</span></div>
    <div class="chips">${reasonList(kind).map(x => `<button class="chip ${a[f] === x.code ? 'on' : ''}" aria-pressed="${a[f] === x.code}" data-act="msl" ${at} data-f="${f}" data-v="${x.code}">${esc(x.label)}</button>`).join('')}
    <button class="chip ${a[f] === OTHER ? 'on' : ''}" aria-pressed="${a[f] === OTHER}" data-act="msl" ${at} data-f="${f}" data-v="${OTHER}">อื่น ๆ</button></div>
    ${a[f] === OTHER ? `<input type="text" style="margin-top:8px" aria-label="ระบุเหตุผล" data-ans="${esc(key)}|${otherF}" maxlength="120" value="${esc(a[otherF] || '')}" placeholder="ระบุเหตุผล">` : ''}</div>`;
  return `<div class="card stack ${miss ? 'miss' : ''}" style="gap:10px">
    <div class="between" style="align-items:flex-start">
      <div><div style="font-weight:600;line-height:1.35">${esc(p.name)}</div><div class="tiny muted">${esc(p.code)} · ${esc(p.barcode)}</div></div>
      ${ok ? `<span class="badge b-ok">${I.check} ครบ</span>` : `<span class="small muted" style="white-space:nowrap">${a.shelf ? 'ตอบต่อ' : 'ยังไม่ตอบ'}</span>`}
    </div>
    <div><div class="q">มีวางบนตู้แช่หรือไม่</div><div class="seg2">${opts('msl', at + ' data-f="shelf"', a.shelf, ['มี', 'ไม่มี'])}</div></div>
    ${a.shelf === 'ไม่มี' ? `<div class="follow">
      <div class="follow-h">${I.branch} ไม่มีบนตู้แช่ — ตอบต่ออีกนิด</div>
      <div><div class="q">มีในสต็อกหรือไม่</div><div class="seg2">${opts('msl', at + ' data-f="stock"', a.stock, ['มี', 'ไม่มี'])}</div></div>
      ${a.stock === 'มี' ? `<div><div class="q">สาขายอมให้จัดเรียงหรือไม่</div><div class="seg2">${opts('msl', at + ' data-f="arrange"', a.arrange, ['ให้จัด', 'ไม่ให้จัด'])}</div></div>` : ''}
      ${a.arrange === 'ไม่ให้จัด' ? reasonBlock('arrange', 'arrangeReason', 'arrangeOther') : ''}
      ${a.stock === 'ไม่มี' ? `<div><div class="q">สาขายอมสั่งของหรือไม่</div><div class="seg2">${opts('msl', at + ' data-f="order"', a.order, ['สั่ง', 'ไม่สั่ง'])}</div></div>` : ''}
      ${a.order === 'ไม่สั่ง' ? reasonBlock('order', 'orderReason', 'orderOther') : ''}
    </div>` : ''}
  </div>`;
}
function stepMsl(v) {
  const rows = rowsOf('msl');
  return `<section class="stack" style="gap:10px" aria-labelledby="h-f">
    <div><h2 id="h-f" style="font-size:20px">สินค้า Must List</h2><div class="small muted">ไม่มีบนตู้แช่ → ถามต่อ สต็อก → จัดเรียง / สั่งของ → เหตุผล</div></div>
    ${rows.map(r => mslCard(v, r)).join('') || '<div class="card muted small">เดือนนี้ไม่มีสินค้า Must List</div>'}
  </section>`;
}
function stepOther(v) {
  const rows = rowsOf('other');
  return `<section class="stack" style="gap:10px" aria-labelledby="h-o">
    <div><h2 id="h-o" style="font-size:20px">สินค้าทั่วไป</h2><div class="small muted">${esc(qBy('Q01').text)} · ตอบ มี/ไม่มี</div></div>
    <div class="card" style="padding:4px 14px">
    ${rows.map((r, i) => { const p = prodBy(r.product), key = rowKey(r), a = v.ans[key] || {};
      return `<div class="between ${S.showMissing && !a.value ? 'missrow' : ''}" style="padding:10px 0;${i ? 'border-top:1px solid var(--line2)' : ''}">
      <div style="min-width:0"><div style="font-weight:500;line-height:1.35">${esc(p.name)}</div><div class="tiny muted">${esc(p.barcode)}</div></div>
      <div class="seg2" style="width:150px;flex-shrink:0">${opts('qv', `data-key="${esc(key)}"`, a.value, qBy(r.q).options)}</div></div>`; }).join('')}
    </div>
  </section>`;
}
function qCard(v, r) {
  const q = qBy(r.q), key = rowKey(r), a = v.ans[key] || {}, miss = S.showMissing && qMissing(r, a), ok = !qMissing(r, a);
  const at = `data-key="${esc(key)}"`;
  const multiBlock = cid => { const cq = qBy(cid), sel = (a.multi || {})[cid] || [];
    return `<div><div class="q">${esc(cq.text)} <span class="muted">(เลือกได้หลายข้อ)</span></div>${chipsOf('qm', at + ` data-q="${cid}"`, sel, cq.options)}
      ${sel.includes(OTHER_OPT) ? `<input type="text" style="margin-top:8px" aria-label="ระบุอื่นๆ" data-ans="${esc(key)}|other|${cid}" maxlength="120" value="${esc((a.other || {})[cid] || '')}" placeholder="ระบุ">` : ''}</div>`; };
  return `<div class="card stack ${miss ? 'miss' : ''}" style="gap:10px">
    <div class="between" style="align-items:flex-start"><div><div class="eyebrow" style="letter-spacing:.04em">${esc(q.cat)}${q.type === 'multiple' ? ' · Multiple' : ''}</div><div style="font-weight:600;line-height:1.35;margin-top:2px">${esc(q.text)}</div></div>
      ${ok ? `<span class="badge b-ok">${I.check}</span>` : ''}</div>
    ${q.type === 'multiple' ? multiBlock(q.id) : `<div class="${q.options.length === 2 ? 'seg2' : 'stack'}" style="${q.options.length === 2 ? '' : 'gap:6px'}">${opts('qv', at, a.value, q.options, 'tall')}</div>
      ${q.follow && a.value === q.follow.on ? `<div class="follow">${q.follow.qs.map(multiBlock).join('')}</div>` : ''}`}
  </div>`;
}
function stepArea(v) {
  const rows = rowsOf('area');
  return `<section class="stack" style="gap:10px" aria-labelledby="h-a">
    <div><h2 id="h-a" style="font-size:20px">กระเช้า · สื่อ · พื้นที่พิเศษ</h2><div class="small muted">คำถามดึงจากคลังคำถาม · ตอบ “มี” แล้วเลือกรายละเอียดต่อ</div></div>
    ${rows.map(r => qCard(v, r)).join('')}

}

function stepPhoto(v) {

      <div class="between"><h2 id="h-cool" style="font-size:18px">รูปหน้าเชลฟ์ (ตู้แช่ขวดเดี่ยว)</h2><span class="small muted">ถ่ายในแอปเท่านั้น</span></div>
      <div class="q" style="margin:0">สามารถถ่ายรูปตู้แช่ขวดเดี่ยวได้ตามปกติหรือไม่</div>
      <div class="stack" style="gap:6px">${opts('cooler', '', v.cooler, SEED.coolerOptions)}</div>
      ${v.cooler && v.cooler !== SEED.coolerOptions[2] ? `<div class="small" style="color:var(--gold-ink);font-weight:500">${v.cooler === SEED.coolerOptions[0] ? 'ถ่ายหลังจากจัดเรียงแล้ว' : 'ถ่ายสภาพตู้แช่ตามจริง'}</div>${photoGrid(v, 'cooler', 'visit')}` : ''}
    </section>
    <section class="card"><label class="lb" for="remark">หมายเหตุ (ถ้ามี)</label><textarea id="remark" data-bind="remark" maxlength="500" placeholder="เช่น ร้านกำลังรีโนเวท">${esc(v.remark)}</textarea></section>`;
}

function vDone() {
  const v = S.lastDone, st = storeBy(v.store);
  const sent = S.server.find(x => x.id === v.id), queued = S.queue.some(x => x.id === v.id);
  return `<main class="main">
    <div class="card stack" style="align-items:center;text-align:center;padding:28px 18px">
      <span class="ico ok" style="width:64px;height:64px;border-radius:32px">${I.check.replace('width="16" height="16"', 'width="32" height="32"')}</span>
      <h1 style="font-size:24px">บันทึกเรียบร้อย</h1>
      <div class="muted">${esc(st.name)} · ${fmtDur((new Date(v.completedAt) - new Date(v.startedAt)) / 1000)} นาที${v.access === 'out' ? ' · เข้าสาขาไม่ได้' : ''}</div>
      ${queued ? `<div class="alert warn" style="text-align:left">${S.syncing ? 'กำลังส่งข้อมูล…' : 'ยังไม่มีสัญญาณ — ข้อมูลเก็บในเครื่องแล้ว จะส่งให้อัตโนมัติเมื่อออนไลน์'}</div>` : ''}
      ${sent ? `<div class="alert ${sent.flags.length ? 'flag' : 'ok'}" style="text-align:left;width:100%">${sent.flags.length ? `${I.flag}<span>ส่งแล้ว แต่ server flag ไว้: ${sent.flags.map(esc).join(' · ')}<br><span class="small">(ในเดโมมักโดน “ใช้เวลาน้อย” เพราะกดเร็ว — กฎขั้นต่ำ ${RULES.minDurationSec / 60} นาที)</span></span>` : 'ส่งเข้า server แล้ว ไม่มีความผิดปกติ'}</div>` : ''}

function vDashboard() {

  const avg = all.length ? all.reduce((a, v) => a + (new Date(v.completedAt) - new Date(v.startedAt)), 0) / all.length / 1000 : 0;
  const pend = S.reports.filter(r => r.status === 'pending');
  const mslRows = PUB.rows.filter(r => r.q === 'MSL');
  const oos = mslRows.map(r => {
    const k = rowKey(r), ans = ins.map(v => v.ans[k]).filter(Boolean), no = ans.filter(a => a.shelf === 'ไม่มี');
    return { p: prodBy(r.product), n: ans.length, no: no.length, pct: ans.length ? Math.round(no.length / ans.length * 100) : 0,
      stockY: no.filter(a => a.stock === 'มี').length, arr: no.filter(a => a.arrange === 'ให้จัด').length, stockN: no.filter(a => a.stock === 'ไม่มี').length, ord: no.filter(a => a.order === 'สั่ง').length };
  }).filter(x => x.n).sort((a, b) => b.pct - a.pct);
  const reasons = {};
  ins.forEach(v => Object.values(v.ans).forEach(a => {
    if (a.orderReason) { const l = 'ไม่สั่ง: ' + reasonLabel('order', a.orderReason, a.orderOther); reasons[l] = (reasons[l] || 0) + 1; }
    if (a.arrangeReason) { const l = 'ไม่ให้จัด: ' + reasonLabel('arrange', a.arrangeReason, a.arrangeOther); reasons[l] = (reasons[l] || 0) + 1; }
  }));

  const purposeCount = SEED.purposes.map(p => [p, all.filter(v => v.purpose === p).length]);

      <button class="btn sm dark" data-act="exportCsv">${I.dl} Export</button></div>
    ${pend.length ? `<section class="card stack approvals"><div class="between"><h2 style="font-size:16px">รออนุมัติ</h2><span class="count">${pend.length}</span></div>
      ${pend.map(r => { const st = storeBy(r.store), u = userBy(r.user); return `<div class="appr">
        <img src="${r.photo}" alt="รูปหน้าร้าน ${esc(st.name)}">
        <div style="flex:1;min-width:0"><span class="badge ${r.type === 'new' ? 'b-ok' : 'b-flag'}">${r.type === 'new' ? 'ร้านใหม่' : 'แจ้งร้านปิด'}</span>
          <div style="font-weight:600;margin-top:2px">${esc(st.name)} <span class="small muted">#${esc(st.code)}</span></div>
          <div class="tiny muted">${esc(u.code)} · ${fmtTime(r.at)}${r.note ? ' · ' + esc(r.note) : ''}</div>
          <div class="row" style="gap:6px;margin-top:6px"><button class="btn sm dark" data-act="approve" data-id="${r.id}">อนุมัติ</button><button class="btn sm" data-act="reject" data-id="${r.id}">ปฏิเสธ</button></div></div></div>`; }).join('')}
    </section>` : ''}
    <div class="kpis">
      <div class="kpi"><b>${all.length}</b><span>สาขาที่เยี่ยม (เข้าไม่ได้ ${all.length - ins.length})</span></div>

    ${list.map(v => visitItem(v, true)).join('') || '<div class="card muted small">ไม่มีรายการ</div>'}
  </main>`;
}

      <div style="overflow-x:auto"><table class="mtable"><thead><tr><th>รหัส</th><th>คำถาม</th><th>ชนิด</th><th>ตัวเลือก</th></tr></thead><tbody>
      ${qs.map(q => `<tr><td><b>${esc(q.id)}</b><div class="tiny muted">${esc(q.key)}</div></td><td>${esc(q.text)}${q.child ? '<div class="tiny muted">คำถามต่อเนื่อง</div>' : ''}</td><td><span class="badge ${q.type === 'multiple' ? 'b-gold' : 'b-grey'}">${q.type === 'multiple' ? 'Multiple' : 'Single'}</span></td><td class="tiny">${q.options.map(esc).join(' · ')}</td></tr>`).join('')}
      </tbody></table></div></section>`; }).join('')}
    <section class="card stack"><h2 style="font-size:16px">เพิ่มคำถามใหม่เข้าคลัง</h2>
      <div class="seg2"><label class="lb">หมวด<select id="nq-cat">${CATS.filter(c => c !== 'Must List').map(c => `<option>${esc(c)}</option>`).join('')}</select></label>
        <label class="lb">ชนิดคำถาม<select id="nq-type"><option value="single">Single Choice</option><option value="multiple">Multiple Choices</option></select></label></div>
      <label class="lb">คำถาม<input id="nq-text" type="text" maxlength="160" placeholder="เช่น มีสื่อโปรโมชั่นใหม่ติดที่ตู้แช่หรือไม่?"></label>
      <label class="lb">ตัวเลือก (คั่นด้วย ,)<input id="nq-opts" type="text" maxlength="300" placeholder="มี, ไม่มี"></label>
      <button class="btn dark" data-act="addQuestion">+ เพิ่มเข้าคลังคำถาม</button></section>`;
}
function aProducts() {
  return `<section class="card stack"><div><h2 style="font-size:16px">Master สินค้า</h2><div class="small muted">รหัสสินค้าและบาร์โค้ดคงที่ · ใช้เลือกในตัวสร้างฟอร์ม</div></div>
    <div style="overflow-x:auto"><table class="mtable"><thead><tr><th>สินค้า</th><th>บาร์โค้ด</th><th>ใช้ในฟอร์ม</th></tr></thead><tbody>
    ${PRODUCTS.map(p => { const r = DRAFT.rows.find(x => x.product === p.id && rowStatus(x) !== 'expired'); return `<tr><td>${esc(p.name)}<div class="tiny muted">${esc(p.id)} · ${esc(p.code)}</div></td><td class="tiny">${esc(p.barcode)}</td><td>${r ? `<span class="badge ${r.q === 'MSL' ? 'b-flag' : 'b-grey'}">${r.q === 'MSL' ? 'Must List' : 'ทั่วไป'}</span>` : '<span class="tiny muted">—</span>'}</td></tr>`; }).join('')}
    </tbody></table></div><div class="tiny muted">* บาร์โค้ดในต้นแบบเป็นเลขสมมติ</div></section>`;
}
function aReasons() {
  const list = (kind, title) => `<section class="card stack"><div><h2 style="font-size:16px">${title}</h2><div class="small muted">ปิดได้แต่ลบไม่ได้ เพื่อให้ข้อมูลย้อนหลังยังอ่านออก</div></div>
    ${DRAFT.reasons[kind].map(r => `<div class="between" style="border-top:1px solid var(--line2);padding-top:8px"><div><b>${esc(r.label)}</b><div class="tiny muted">${esc(r.code)}</div></div>
      <button class="switch" role="switch" aria-checked="${r.active}" aria-label="ใช้งาน ${esc(r.label)}" data-act="rActive" data-kind="${kind}" data-code="${esc(r.code)}"><i></i></button></div>`).join('')}
    <div class="row"><input id="nr-${kind}" type="text" maxlength="60" placeholder="เพิ่มเหตุผลใหม่"><button class="btn dark" data-act="addReason" data-kind="${kind}">เพิ่ม</button></div>
    <div class="tiny muted">พนักงานจะเห็นตัวเลือก “อื่น ๆ (ระบุ)” ต่อท้ายเสมอ</div></section>`;
  return list('arrange', 'เหตุผล: สาขาไม่ให้จัดเรียง (M04)') + list('order', 'เหตุผล: สาขาไม่สั่งของ (M06)');
}
function aPublish() {
  const key = r => r.q + ':' + (r.product || '-') + ':' + r.start + ':' + r.end;
  const pubK = new Set(PUB.rows.map(key)), drK = new Set(DRAFT.rows.map(key));
  const added = DRAFT.rows.filter(r => !pubK.has(key(r))), removed = PUB.rows.filter(r => !drK.has(key(r)));
  const rDiff = JSON.stringify(DRAFT.reasons) !== JSON.stringify(PUB.reasons);
  const line = (r, sign) => { const L = rowLabel(r), p = r.product ? prodBy(r.product) : null; return `<div class="diff ${sign === '+' ? 'add' : 'del'}"><b>${sign}</b> ${esc(p ? p.name : L.text)} <span class="tiny muted">· ${esc(L.cat)} · ${fmtD(r.start)}–${fmtD(r.end)}</span></div>`; };
  const dirty = isDirty();
  return `<section class="card stack"><h2 style="font-size:16px">สิ่งที่เปลี่ยนจาก v${PUB.version}</h2>
      ${dirty ? [...added.map(r => line(r, '+')), ...removed.map(r => line(r, '−')), rDiff ? '<div class="diff add"><b>~</b> แก้ไขรายการเหตุผล</div>' : ''].join('') : '<div class="small muted">ไม่มีการเปลี่ยนแปลง</div>'}
    </section>
    <section class="card stack"><h2 style="font-size:16px">กฎการเผยแพร่</h2>
      <div class="small">• เผยแพร่แล้ว<b>ล็อก</b> — แก้ระหว่างเดือนจะกลายเป็นเวอร์ชันใหม่ เวอร์ชันเก่ายังเก็บไว้</div>
      <div class="small">• คำถามที่<b>ตั้งเวลา</b>ไว้ จะขึ้นให้พนักงานเห็นเองเมื่อถึงวันเริ่ม และหายเองเมื่อหมดเวลา</div>
      <div class="small">• คำตอบผูกกับ <b>รหัสคำถาม + รหัสสินค้า</b> จึงเทียบข้ามเดือนได้เสมอ</div></section>
    <div class="seg2"><button class="btn" data-act="discard" ${dirty ? '' : 'disabled'}>ยกเลิก Draft</button><button class="btn primary" data-act="publish" ${dirty ? '' : 'disabled'}>Publish v${PUB.version + 1}</button></div>`;
}

/* --- รีพอร์ตของเมอร์: แพลน vs เข้าจริง 7 วัน --- */
const DOW = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
function planOf(user, dayIso) {
  // แพลนจำลอง: วันละ 5–7 สาขาจากเส้นทาง · การแวะ = จำนวนร้าน + ร้านที่ต้องกลับไปติดตามงาน
  const route = user.route.map(storeBy).filter(Boolean);
  const rnd = mulberry32(dayIso.split('-').join('') * 1 + user.code.length);
  if (dayIso === TODAY) return { stores: route.map(s => s.code), revisit: route.slice(0, 1).map(s => s.code) };
  const n = Math.min(route.length, 5 + Math.floor(rnd() * 3));
  const stores = route.slice().sort(() => rnd() - .5).slice(0, n).map(s => s.code);
  return { stores, revisit: rnd() < .5 ? [stores[0]] : [] };
}
function recordsOf(user, dayIso) {
  const real = [...S.server, ...S.queue].filter(v => v.user === user.code && iso(v.startedAt) === dayIso);
  if (dayIso === TODAY) return real.map(v => ({ code: v.store, time: v.startedAt, purpose: v.purpose, access: v.access }));
  const plan = planOf(user, dayIso), rnd = mulberry32(dayIso.split('-').join('') * 3 + 11), out = [];
  const visitCount = plan.stores.length + plan.revisit.length;
  let t = new Date(dayIso + 'T08:40:00');
  plan.stores.forEach((c, i) => { if (rnd() < .86) { out.push({ code: c, time: t.toISOString(), purpose: 'เข้าตามปกติ', access: rnd() < .95 ? 'in' : 'out' }); } t = new Date(t.getTime() + (35 + rnd() * 25) * 60000); });
  plan.revisit.forEach(c => { if (rnd() < .7) out.push({ code: c, time: t.toISOString(), purpose: 'ติดตามงาน', access: 'in' }); });
  return out.slice(0, visitCount);
}
function vReport() {
  const u = S.user;
  const days = Array.from({ length: 7 }, (_, i) => addDays(i - 6));
  const rows = days.map(d => {
    const p = planOf(u, d), rec = recordsOf(u, d);
    const visited = new Set(rec.map(r => r.code));
    return { d, planStores: p.stores.length, realStores: p.stores.filter(c => visited.has(c)).length + [...visited].filter(c => !p.stores.includes(c)).length,
      planVisits: p.stores.length + p.revisit.length, realVisits: rec.length, plan: p, rec };
  });
  if (!S.repDay || !days.includes(S.repDay)) S.repDay = TODAY;
  const sel = rows.find(r => r.d === S.repDay);
  const max = Math.max(...rows.map(r => Math.max(r.planVisits, r.realVisits)), 1);
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const dl = d => { const x = new Date(d + 'T00:00:00'); return `${DOW[x.getDay()]} ${x.getDate()}`; };
  const recBy = new Map(); sel.rec.forEach(r => { if (!recBy.has(r.code)) recBy.set(r.code, r); });
  return `<main class="main">
    <div><h1 style="font-size:24px">รีพอร์ตของฉัน</h1><div class="small muted">${esc(u.code)} ${esc(u.name)} · ย้อนหลัง 7 วัน</div></div>
    <div class="kpis">
      <div class="kpi"><b>${sum('realStores')}<span class="kof">/${sum('planStores')}</span></b><span>ร้านที่เข้าจริง / แพลน · ${pct(sum('realStores'), sum('planStores'))}</span></div>
      <div class="kpi"><b>${sum('realVisits')}<span class="kof">/${sum('planVisits')}</span></b><span>การแวะจริง / แพลน · ${pct(sum('realVisits'), sum('planVisits'))}</span></div>
    </div>
    <section class="card stack"><div class="between"><h2 style="font-size:16px">แพลน vs เข้าจริง รายวัน</h2>
      <div class="legend"><span><i style="background:#D9D5CE"></i>แพลน</span><span><i style="background:var(--red)"></i>เข้าจริง</span></div></div>
      <div class="chart" role="img" aria-label="กราฟจำนวนการแวะ แพลนเทียบเข้าจริง 7 วัน">
        ${rows.map(r => `<button class="col ${r.d === S.repDay ? 'on' : ''}" data-act="repDay" data-d="${r.d}" aria-label="${dl(r.d)} แพลน ${r.planVisits} เข้าจริง ${r.realVisits}">
          <span class="bars"><i class="p" style="height:${Math.round(r.planVisits / max * 100)}%"></i><i class="a" style="height:${Math.round(r.realVisits / max * 100)}%"></i></span>
          <span class="cv">${r.realVisits}/${r.planVisits}</span><span class="cd">${dl(r.d)}</span></button>`).join('')}
      </div>
      <div class="tiny muted">แตะที่วันเพื่อดูรายการร้าน · ตัวเลข = การแวะจริง/แพลน</div>
    </section>
    <section class="card"><div style="overflow-x:auto"><table class="mtable">
      <thead><tr><th>วัน</th><th class="num">ร้านแพลน</th><th class="num">ร้านเข้าจริง</th><th class="num">แวะแพลน</th><th class="num">แวะจริง</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="${r.d === S.repDay ? 'sel' : ''}"><td>${dl(r.d)}${r.d === TODAY ? ' <span class="badge b-gold">วันนี้</span>' : ''}</td><td class="num">${r.planStores}</td><td class="num">${r.realStores}</td><td class="num">${r.planVisits}</td><td class="num"><b style="color:${r.realVisits >= r.planVisits ? 'var(--ok-ink)' : 'inherit'}">${r.realVisits}</b></td></tr>`).join('')}</tbody>
    </table></div></section>
    <section class="card stack"><div class="between"><h2 style="font-size:16px">ร้านในแพลน · ${dl(S.repDay)}</h2><span class="small muted">${sel.realStores}/${sel.planStores} ร้าน</span></div>
      ${sel.plan.stores.map(c => { const st = storeBy(c), r = recBy.get(c), again = sel.plan.revisit.includes(c);
        return `<div class="between" style="border-top:1px solid var(--line2);padding-top:8px">
          <div style="min-width:0"><b>${esc(st.name)}</b> <span class="small muted">#${esc(c)}</span>${again ? ' <span class="badge b-gold">แวะ 2 ครั้ง</span>' : ''}</div>
          ${r ? `<span class="badge ${r.access === 'out' ? 'b-warn' : 'b-ok'}">${r.access === 'out' ? 'เข้าไม่ได้' : 'เข้าแล้ว'} ${fmtTime(r.time)}</span>` : `<span class="badge b-grey">${S.repDay === TODAY ? 'ยังไม่เข้า' : 'ไม่ได้เข้า'}</span>`}</div>`; }).join('')}
    </section>
    <section class="card stack"><div class="between"><h2 style="font-size:16px">Record การเข้าเยี่ยม · ${dl(S.repDay)}</h2><span class="small muted">${sel.rec.length} ครั้ง</span></div>
      ${sel.rec.length ? sel.rec.slice().sort((a, b) => a.time.localeCompare(b.time)).map(r => { const st = storeBy(r.code); return `<div class="row" style="border-top:1px solid var(--line2);padding-top:8px">
        <span class="dist" style="width:48px">${fmtTime(r.time)}</span><div style="flex:1;min-width:0"><b>${esc(st.name)}</b> <span class="small muted">#${esc(r.code)}</span></div>
        <span class="badge ${r.purpose === 'เข้าตามปกติ' ? 'b-grey' : 'b-gold'}">${esc(r.purpose || '')}</span></div>`; }).join('') : '<div class="small muted">ยังไม่มีการเข้าเยี่ยม</div>'}
    </section>
  </main>`;
}

function render() {
  const app = document.getElementById('app');
  const views = { login: vLogin, home: vHome, pick: vPick, newstore: vNewStore, closed: vClosed, audit: vAudit, done: vDone, queue: vQueue, dashboard: vDashboard, detail: vDetail, form: vForm, report: vReport };
  app.innerHTML = header() + views[S.screen]() + (S.screen === 'audit' ? '' : '<div class="note">Scotch Field Audit · Concept prototype v3 · ข้อมูลจำลองทั้งหมด</div>');
}

let toastTimer;
function toast(msg) {
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { r.innerHTML = ''; }, 3200);
}

/* =============================================================
   11) EVENTS — event delegation จุดเดียว
   ============================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'store-q') {
    S.search = t.value;
    const withD = routeStores().map(s => ({ ...s, d: S.pos ? haversine(S.pos, s) : null, t: S.pos ? tierOf(S.pos, s).k : null }));
    document.getElementById('store-list').innerHTML = storeList(withD, S.search.trim().toLowerCase());
  }
  if (t.dataset.bind && S.visit) S.visit[t.dataset.bind] = t.value;
  if (t.dataset.draft && S.draft) S.draft[t.dataset.draft] = t.value;
  if (t.dataset.ans && S.visit) {
    const [key, f, cid] = t.dataset.ans.split('|'); const a = ansOf(key);
    if (f === 'other') { a.other = a.other || {}; a.other[cid] = t.value; } else a[f] = t.value;
  }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.sel; if (!k) return;
  S.b[k] = t.value;
  if (k === 'cat') { S.b.q = t.value === 'Must List' ? 'MSL' : ((QM.find(q => q.cat === t.value && !q.child) || {}).id || ''); S.b.product = ''; }
  if (k === 'q') S.b.product = '';
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pin') A.login(); });
setInterval(() => { const el = document.getElementById('elapsed'); if (el && S.visit) el.textContent = fmtDur((Date.now() - new Date(S.visit.surveyStartedAt || S.visit.startedAt)) / 1000); }, 1000);

seedToday();
render();
</script>
