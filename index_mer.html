<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Scotch Field Audit — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600&display=swap">
<!--
  ============================================================
  Scotch Field Audit — Concept Prototype (single HTML file)
  ------------------------------------------------------------
  • ไฟล์เดียวจบ: HTML + CSS + JS + ข้อมูลจำลอง (ไม่มี database / server จริง)
  • "Server" ในไฟล์นี้ = ฟังก์ชัน serverReceive() ที่จำลองสิ่งที่ API จริงจะทำ
  • ข้อมูลอยู่ในหน่วยความจำ — refresh หน้าแล้วจะกลับไปเป็นค่าเริ่มต้น
  • ใช้งานจริงจะแยกเป็น: PWA (มือถือ) → ASP.NET Core API → SQL Server
  ============================================================
-->
<style>
:root{
  color-scheme: light;
  --bg:#F3F2EF; --page:#E7E5E1; --surface:#FFFFFF; --line:#E4E2DD; --line2:#EEECE8;
  --ink:#1B1A19; --ink2:#57534E; --ink3:#6B665F;
  --red:#C4121A; --red-ink:#A30F16; --brand:#ED1C24; --gold:#E6BF8A;
  --gold-bg:#FBF4E8; --gold-line:#EBDABD; --gold-ink:#6E4F18;
  --ok:#1E7A4C; --ok-bg:#E7F3EC; --ok-ink:#1E6B44;
  --warn-bg:#FDF0E1; --warn-ink:#8A4108; --flag-bg:#FCE8E8; --flag-ink:#9B1C1C;
  --radius:16px;
  --font:'IBM Plex Sans Thai', 'Sarabun', 'Leelawadee UI', 'Thonburi', system-ui, sans-serif;
  --display:'Kanit', 'IBM Plex Sans Thai', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #2F6FDB;outline-offset:2px}
.app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2}
.muted{color:var(--ink3)} .small{font-size:12px} .tiny{font-size:11px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}

/* header */
.hdr{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-top{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{height:28px;width:auto;display:block}
.vsep{width:1px;height:22px;background:var(--line)}
.app-name{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.02em}
.net{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;border:0;font-size:12px;font-weight:600}
.net.on{background:var(--ok-bg);color:var(--ok-ink)} .net.off{background:var(--warn-bg);color:var(--warn-ink)}
.dot{width:7px;height:7px;border-radius:4px;background:currentColor;display:block}
.avatar{width:34px;height:34px;border-radius:17px;border:0;background:var(--ink);color:var(--gold);font-family:var(--display);font-size:12px;font-weight:500}
.tabs{display:flex;gap:4px;padding:0 12px 8px}
.tab{flex:1;height:38px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:var(--ink);color:#fff}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

/* cards & buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.flat{padding:0;overflow:hidden}
.card.miss{border-color:var(--red);box-shadow:0 0 0 2px rgba(196,18,26,.12)}
.btn{height:48px;padding:0 16px;border-radius:14px;border:1px solid #D9D5CE;background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.block{width:100%} .btn.big{height:56px;font-size:16px}
.btn.sm{height:36px;font-size:13px;padding:0 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--red-ink);font-weight:600;font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}

/* options */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opt{height:46px;border-radius:12px;border:1px solid #D9D5CE;background:var(--surface);font-family:var(--display);font-size:19px;font-weight:500}
.opt.txt{font-family:var(--font);font-size:14px;height:44px;border-radius:10px}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1px solid #D9D5CE;background:var(--surface);font-size:13px;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.follow{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.follow-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--gold-ink)}
.q{font-size:13px;font-weight:500;margin-bottom:6px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok-ink)} .b-warn{background:var(--warn-bg);color:var(--warn-ink)}
.b-flag{background:var(--flag-bg);color:var(--flag-ink)} .b-gold{background:#F7E9D2;color:var(--gold-ink)}
.b-grey{background:var(--line2);color:var(--ink2)}

/* store */
.store-top{height:4px;background:var(--brand)}
.store-body{padding:16px 16px 14px}
.store-name{font-size:26px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line2)}
.fact{padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.fact+.fact{border-left:1px solid var(--line2)}
.ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico.ok{background:var(--ok-bg);color:var(--ok)} .ico.warn{background:var(--warn-bg);color:var(--warn-ink)} .ico.grey{background:var(--bg);color:var(--ink2)}
.fact b{display:block;font-size:13px} .fact span{font-size:12px;color:var(--ink3)}

/* steps */
.steps{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stepbtn{height:52px;border:0;border-radius:10px;background:transparent;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.stepbtn b{font-size:13px;font-weight:600} .stepbtn span{font-family:var(--display);font-size:12px}
.stepbtn.on{background:var(--ink);color:#fff} .stepbtn.on span{color:var(--gold)}
.stepbtn.done span{color:var(--ok-ink)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .25s}

/* list items */
.item{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.dist{font-family:var(--display);font-size:14px;font-weight:500;white-space:nowrap}

/* photos */
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#2A2826}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.addph{aspect-ratio:3/4;border-radius:12px;border:1.5px dashed #C9C4BC;background:#FAF9F7;color:var(--red-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.addph i{width:44px;height:44px;border-radius:22px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}

.switch{width:52px;height:32px;border-radius:16px;border:0;background:#CFCAC2;padding:3px;display:flex;justify-content:flex-start;flex-shrink:0}
.switch[aria-checked="true"]{background:var(--ink);justify-content:flex-end}
.switch i{width:26px;height:26px;border-radius:13px;background:#fff;display:block}

input[type=text],input[type=password],input[type=search],textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid #C9C4BC;background:var(--surface);padding:10px 12px;font-size:15px}
textarea{min-height:76px;resize:vertical}
label.lb{display:block;font-size:13px;font-weight:600;margin-bottom:6px}

.footer-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:4}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink3)}
.alert{border-radius:12px;padding:12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-bg);color:var(--warn-ink)} .alert.flag{background:var(--flag-bg);color:var(--flag-ink)} .alert.ok{background:var(--ok-bg);color:var(--ok-ink)} .alert.info{background:#EAF1FB;color:#1D4E89}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line2)}
th{font-size:12px;color:var(--ink3);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
pre.json{margin:0;background:#1B1A19;color:#EDE9E3;border-radius:12px;padding:12px;font-size:11px;line-height:1.5;overflow:auto;max-height:320px}
.log{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#1B1A19;color:#EDE9E3;border-radius:12px;padding:10px 12px;max-height:220px;overflow:auto}
.log div{padding:2px 0}
.log .ok{color:#8FD6AE} .log .dup{color:#F2C46D}
.users{display:grid;gap:8px}
.ucard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.ucard[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ucard .avatar{flex-shrink:0}
.note{font-size:11px;color:var(--ink3);text-align:center;padding:16px 16px 24px}

/* toast & modal */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);max-width:400px;width:calc(100% - 32px);background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;z-index:40;background:#0E0D0C;display:flex;justify-content:center}
.modal[hidden]{display:none}
.cam{width:100%;max-width:440px;display:flex;flex-direction:column;color:#fff}
.cam-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600}
.cam-view{flex:1;position:relative;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam-view video,.cam-view canvas{width:100%;height:100%;object-fit:cover}
.cam-bar{height:120px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px}
.shutter{width:72px;height:72px;border-radius:36px;border:4px solid #fff;background:var(--brand)}
.cam-note{margin:0;padding:0 16px 18px;text-align:center;font-size:12px;color:#BDB7AE}
.ghost-dark{height:44px;border-radius:12px;border:1px solid #4A4642;background:transparent;color:#fff;padding:0 14px;justify-self:start}
@media (min-width:900px){ body{padding:24px 0} .app{min-height:calc(100vh - 48px);border-radius:24px;overflow:hidden} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal" id="modal" hidden></div>
<div id="toast-root" aria-live="polite"></div>

/* =============================================================
   1) STATE — ระบบจริง: ฝั่งมือถือเก็บใน IndexedDB, ฝั่ง server ใน SQL
   ============================================================= */
const S = {
  screen: 'login', user: null, loginCode: USERS[0].code,
  online: true, posMode: 'store', pos: null,
  search: '', visit: null, step: 0, showMissing: false,
  queue: [],    // ข้อมูลที่บันทึกในเครื่องแล้ว แต่ยังไม่ได้ส่ง (outbox)
  server: [],   // ข้อมูลที่ "server" ได้รับแล้ว (= ตาราง Visits)
  log: [], lastDone: null, filterFlag: false, detailId: null,
  formVersion: SEED.form.version, syncing: false
};

/* =============================================================
   2) "SERVER" จำลอง — สิ่งที่ API จริงจะทำเมื่อได้รับข้อมูล
   ============================================================= */
function serverReceive(v, receivedAt) {
  // (ก) Idempotency: VisitId ซ้ำ = เคยรับแล้ว → ไม่บันทึกซ้ำ
  if (S.server.some(x => x.id === v.id)) return { status: 200, note: 'ซ้ำ → ข้าม (ไม่บันทึกซ้ำ)' };
  const rec = JSON.parse(JSON.stringify(v));
  rec.receivedAt = (receivedAt || new Date()).toISOString();
  // (ข) Server คำนวณระยะเองจากพิกัด — ไม่เชื่อค่าที่มือถือส่งมา
  const st = storeBy(v.store);
  rec.distance = Math.round(haversine({ lat: v.lat, lng: v.lng }, st));
  // (ค) กฎ flag ความผิดปกติ
  const flags = [];
  const dur = (new Date(v.completedAt) - new Date(v.startedAt)) / 1000;
  const late = (new Date(rec.receivedAt) - new Date(v.completedAt)) / 3600000;
  if (rec.distance > RULES.maxDistanceM) flags.push(`อยู่ห่างร้าน ${fmtDist(rec.distance)}`);
  if (dur < RULES.minDurationSec) flags.push(`ใช้เวลาเพียง ${fmtDur(dur)} นาที`);
  if (late > RULES.lateHours) flags.push(`ส่งย้อนหลัง ${late.toFixed(1)} ชม.`);
  if (v.acc > RULES.maxAccuracyM) flags.push(`GPS ไม่แม่นยำ (±${Math.round(v.acc)} ม.)`);
  rec.flags = flags;
  S.server.push(rec);
  return { status: 201, note: flags.length ? `รับแล้ว · flag ${flags.length}` : 'รับแล้ว' };
}

/* =============================================================
   3) ภาพจำลอง (ใช้เมื่อไม่มีกล้อง) + ประทับเวลา/พิกัดลงภาพ
   ============================================================= */
function drawShelf(ctx, w, h, seed) {
  const rnd = mulberry32(seed || Date.now());
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#3A3733'); g.addColorStop(1, '#22201E');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const cols = ['#ED1C24', '#ED1C24', '#E6BF8A', '#8C8780', '#6E8FA8', '#B9B4AC', '#C4121A', '#4F7A5E'];
  const rows = 4, rowH = h * 0.8 / rows;
  for (let r = 0; r < rows; r++) {
    const base = h * 0.08 + rowH * (r + 1);
    let x = w * 0.04;
    while (x < w * 0.94) {
      const pw = w * (0.05 + rnd() * 0.03), ph = rowH * (0.55 + rnd() * 0.3);
      ctx.fillStyle = cols[Math.floor(rnd() * cols.length)];
      ctx.fillRect(x, base - ph, pw, ph);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + pw * 0.15, base - ph * 0.7, pw * 0.7, ph * 0.18);
      x += pw + w * 0.008;
    }
    ctx.fillStyle = '#6A655F'; ctx.fillRect(0, base, w, h * 0.012);
    ctx.fillStyle = '#F2EFEA'; ctx.fillRect(w * 0.1, base + h * 0.014, w * 0.07, h * 0.02); // ป้ายราคา
    ctx.fillRect(w * 0.55, base + h * 0.014, w * 0.07, h * 0.02);
  }
}
function stamp(ctx, w, h, lines) {
  const bh = h * 0.12, fs = Math.max(11, Math.round(h * 0.03));
  ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0, h - bh, w, bh);
  ctx.fillStyle = '#fff'; ctx.font = `600 ${fs}px sans-serif`; ctx.textBaseline = 'middle';
  ctx.fillText(lines[0], w * 0.035, h - bh * 0.68);
  ctx.font = `${fs}px sans-serif`; ctx.fillText(lines[1], w * 0.035, h - bh * 0.3);
  ctx.textAlign = 'right'; ctx.fillStyle = '#E6BF8A'; ctx.font = `600 ${Math.round(fs * 0.8)}px sans-serif`;
  ctx.fillText('SCOTCH FIELD AUDIT', w * 0.965, h - bh * 0.68); ctx.textAlign = 'left';
}
function makePhoto(source, meta, seed) {
  // source = <video> หรือ null (ภาพจำลอง)
  let w = 720, h = 960;
  if (source && source.videoWidth) { const s = Math.min(1, 1024 / Math.max(source.videoWidth, source.videoHeight)); w = Math.round(source.videoWidth * s); h = Math.round(source.videoHeight * s); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (source && source.videoWidth) ctx.drawImage(source, 0, 0, w, h); else drawShelf(ctx, w, h, seed);
  stamp(ctx, w, h, [`${fmtDT(meta.takenAt)} · สาขา ${meta.store}`, `${meta.lat.toFixed(5)}, ${meta.lng.toFixed(5)}  ±${Math.round(meta.acc)} ม.`]);
  const data = c.toDataURL('image/jpeg', 0.72);
  return { data, takenAt: meta.takenAt, lat: meta.lat, lng: meta.lng, kb: Math.round(data.length * 0.75 / 1024) };
}

/* =============================================================
   4) ข้อมูลตัวอย่างของวันนี้ (ให้ dashboard มีอะไรดู)
   ============================================================= */
function seedToday() {
  const rnd = mulberry32(2027);
  const ffs = USERS.filter(u => u.role === 'FF');
  const today = new Date(Date.now() - (10 * 26 + 30) * 60000);   // ให้ทุกรายการจบก่อน "ตอนนี้"
  for (let i = 0; i < 10; i++) {
    const u = ffs[i % ffs.length], st = STORES[(i * 5 + 2) % STORES.length];
    const start = new Date(today.getTime() + i * 26 * 60000);
    let durMin = 9 + Math.floor(rnd() * 8);
    let off = { lat: (rnd() - .5) * 0.0006, lng: (rnd() - .5) * 0.0006 };
    let acc = 6 + Math.round(rnd() * 12), recvLagMin = 1 + Math.floor(rnd() * 20);
    if (i === 3) durMin = 2.4;                               // ทำเร็วผิดปกติ
    if (i === 6) off = { lat: 0.0072, lng: 0.0041 };         // อยู่ไกลร้าน
    if (i === 8) recvLagMin = 5 * 60 + 10;                   // ส่งย้อนหลัง
    const end = new Date(start.getTime() + durMin * 60000);
    const v = { id: uuid(), user: u.code, store: st.code, startedAt: start.toISOString(), completedAt: end.toISOString(),
      lat: st.lat + off.lat, lng: st.lng + off.lng, acc, counts: {}, follow: {}, comp: {}, posm: {},
      photos: [], noPhoto: false, noPhotoReason: '', remark: '', formVersion: 1 };
    active('S').forEach(p => {
      const n = [0, 1, 1, 2, 2, 3][Math.floor(rnd() * 6)]; v.counts[p.id] = n;
      if (n === 0) { const stock = rnd() < .5 ? 'yes' : 'no'; v.follow[p.id] = { stock };
        if (stock === 'no') { v.follow[p.id].order = rnd() < .5 ? 'yes' : 'no'; if (v.follow[p.id].order === 'no') v.follow[p.id].reason = SEED.reasons[Math.floor(rnd() * 4)]; } }
    });
    active('C').forEach(p => v.comp[p.id] = Math.floor(rnd() * 4));
    active('P').forEach(p => v.posm[p.id] = rnd() < .45 ? 1 : 0);
    if (i === 5) { v.noPhoto = true; v.noPhotoReason = 'ผู้จัดการสาขาไม่อนุญาตให้ถ่ายรูป'; }
    else { const n = 1 + (i % 2); for (let k = 0; k < n; k++) v.photos.push(makePhoto(null, { takenAt: new Date(start.getTime() + (3 + k) * 60000).toISOString(), store: st.code, lat: v.lat, lng: v.lng, acc }, 99 + i * 7 + k)); }
    serverReceive(v, new Date(end.getTime() + recvLagMin * 60000));
  }
}

/* =============================================================
   5) ตำแหน่ง (GPS จริง หรือจำลอง)
   ============================================================= */
function setPosMode(m) {
  S.posMode = m;
  const home = storeBy('10');
  if (m === 'store') S.pos = { lat: home.lat + 0.00011, lng: home.lng + 0.00009, acc: 8, src: 'จำลอง: ยืนหน้าร้าน ลาดพร้าว 101' };
  else if (m === 'far') S.pos = { lat: home.lat + 0.0088, lng: home.lng + 0.0046, acc: 14, src: 'จำลอง: ห่างจากร้านราว 1 กม.' };
  else {
    S.pos = null;
    if (!navigator.geolocation) { toast('เบราว์เซอร์นี้ไม่รองรับ GPS — กลับไปใช้ตำแหน่งจำลอง'); return setPosMode('store'); }
    navigator.geolocation.getCurrentPosition(
      p => { S.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, src: 'GPS จริงจากเครื่องนี้' }; render(); },
      e => { toast('ใช้ GPS จริงไม่ได้ (' + e.message + ') — ต้องเปิดผ่าน HTTPS และกดอนุญาต'); setPosMode('store'); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  }
  render();
}

/* =============================================================
   6) ACTIONS — ทุกปุ่มมี data-act="ชื่อ" แล้วมาเข้าที่นี่
   ============================================================= */
const A = {
  pickUser(d) { S.loginCode = d.code; render(); },
  login() {
    const pin = (document.getElementById('pin') || {}).value || '';
    const u = userBy(S.loginCode);
    if (!u || pin !== u.pin) return toast('PIN ไม่ถูกต้อง (ทดสอบใช้ 1234)');
    S.user = u; S.screen = u.role === 'FF' ? 'home' : 'dashboard';
    if (u.role === 'FF' && !S.pos) setPosMode('store'); else render();
  },
  logout() { if (S.visit && !confirmLeave()) return; S.user = null; S.visit = null; S.screen = 'login'; render(); },
  toggleNet() {
    S.online = !S.online;
    toast(S.online ? 'กลับมาออนไลน์ — กำลังส่งข้อมูลที่ค้าง' : 'จำลองว่าไม่มีสัญญาณ — ข้อมูลจะเก็บในเครื่องก่อน');
    render(); if (S.online && S.queue.length) A.sync();
  },
  go(d) { if (S.visit && S.screen === 'audit' && d.to !== 'audit' && !confirmLeave()) return; if (d.to !== 'audit') S.visit = S.screen === 'audit' ? null : S.visit; S.screen = d.to; S.showMissing = false; render(); window.scrollTo(0, 0); },
  pos(d) { setPosMode(d.m); },
  pickStore(d) {
    if (!S.pos) return toast('กำลังหาตำแหน่ง… ลองอีกครั้ง');
    S.visit = { id: uuid(), user: S.user.code, store: d.code, startedAt: new Date().toISOString(), completedAt: null,
      lat: S.pos.lat, lng: S.pos.lng, acc: S.pos.acc, counts: {}, follow: {}, comp: {}, posm: {},
      photos: [], noPhoto: false, noPhotoReason: '', remark: '', formVersion: S.formVersion };
    S.step = 0; S.showMissing = false; S.screen = 'audit'; render(); window.scrollTo(0, 0);
  },
  count(d) { S.visit.counts[d.p] = +d.v; render(); },
  follow(d) {
    const f = S.visit.follow[d.p] = S.visit.follow[d.p] || {};
    f[d.k] = d.v;
    if (d.k === 'stock' && d.v === 'yes') { delete f.order; delete f.reason; }
    if (d.k === 'order' && d.v === 'yes') delete f.reason;
    render();
  },
  comp(d) { S.visit.comp[d.p] = +d.v; render(); },
  posm(d) { S.visit.posm[d.p] = +d.v; render(); },
  step(d) { S.step = +d.n; render(); window.scrollTo(0, 0); },
  next() { S.step = Math.min(3, S.step + 1); render(); window.scrollTo(0, 0); },
  prev() { S.step = Math.max(0, S.step - 1); render(); window.scrollTo(0, 0); },
  camera() { openCamera(); },
  camClose() { closeCamera(); },
  camShot() {
    const v = document.getElementById('cam-video');
    const p = makePhoto(camSim ? null : v, { takenAt: new Date().toISOString(), store: S.visit.store, lat: S.visit.lat, lng: S.visit.lng, acc: S.visit.acc }, Date.now() % 100000);
    S.visit.photos.push(p); closeCamera(); render(); toast(`ถ่ายแล้ว · ${p.kb} KB (บีบอัดก่อนส่ง)`);
  },
  delPhoto(d) { S.visit.photos.splice(+d.i, 1); render(); },
  noPhoto() { S.visit.noPhoto = !S.visit.noPhoto; render(); },
  submit() {
    const miss = missing(S.visit);
    const total = miss.reduce((a, b) => a + b, 0);
    if (total) {
      S.showMissing = true; S.step = miss.findIndex(n => n > 0); render(); window.scrollTo(0, 0);
      return toast(`ยังตอบไม่ครบ ${total} รายการ — ไฮไลต์สีแดงไว้ให้แล้ว`);
    }
    const v = S.visit; v.completedAt = new Date().toISOString();
    S.queue.push(v); S.lastDone = v; S.visit = null; S.screen = 'done'; render(); window.scrollTo(0, 0);
    if (S.online) A.sync();
  },
  sync() {
    if (!S.online) return toast('ยังออฟไลน์อยู่ — ข้อมูลรออยู่ในคิว');
    if (!S.queue.length || S.syncing) return;
    S.syncing = true; render();
    setTimeout(() => {                    // จำลองเวลาเครือข่าย
      S.queue.forEach(v => { const r = serverReceive(v); S.log.unshift({ t: new Date(), id: v.id, store: v.store, ...r }); });
      const n = S.queue.length; S.queue = []; S.syncing = false; render(); toast(`ส่งสำเร็จ ${n} รายการ`);
    }, 900);
  },
  resend() {   // ทดสอบ: ส่งข้อมูลก้อนเดิมซ้ำ (เช่น เน็ตหลุดตอนรอคำตอบ)
    const mine = S.server.filter(v => v.user === S.user.code);
    if (!mine.length) return toast('ยังไม่มีข้อมูลที่ส่งแล้วให้ทดสอบ');
    const v = mine[mine.length - 1]; const r = serverReceive(v);
    S.log.unshift({ t: new Date(), id: v.id, store: v.store, ...r }); render();
  },
  filter(d) { S.filterFlag = d.v === 'flag'; render(); },
  detail(d) { S.detailId = d.id; S.screen = 'detail'; render(); window.scrollTo(0, 0); },
  exportCsv() { exportCsv(); },
  pActive(d) { const p = prodBy(d.id); p.active = !p.active; S.formVersion++; render(); },
  pFocus(d) { const p = prodBy(d.id); p.focus = !p.focus; S.formVersion++; render(); },
  addSku() {
    const el = document.getElementById('new-sku'); const name = (el.value || '').trim();
    if (name.length < 3) return toast('พิมพ์ชื่อสินค้าอย่างน้อย 3 ตัวอักษร');
    PRODUCTS.push({ id: 'S' + String(PRODUCTS.length + 1).padStart(2, '0') + 'N', type: 'S', name: name.slice(0, 120), active: true, focus: true });
    S.formVersion++; render(); toast('เพิ่มแล้ว — FF จะเห็นในฟอร์มทันทีโดยไม่ต้องแก้โค้ด');
  }
};
function confirmLeave() { return window.confirm('ยังตรวจร้านนี้ไม่เสร็จ ออกจากหน้านี้หรือไม่? (ข้อมูลร้านนี้จะหาย)'); }

/* ตรวจความครบถ้วน: คืนค่าจำนวนที่ขาดของแต่ละขั้น [สก๊อต, คู่แข่ง, POSM, รูป] */
function skuMissing(v, p) {
  const c = v.counts[p.id], f = v.follow[p.id] || {};
  if (c === undefined) return true;
  if (c === 0) { if (!f.stock) return true; if (f.stock === 'no' && !f.order) return true; if (f.order === 'no' && !f.reason) return true; }
  return false;
}
function missing(v) {
  return [
    active('S').filter(p => skuMissing(v, p)).length,
    active('C').filter(p => v.comp[p.id] === undefined).length,
    active('P').filter(p => v.posm[p.id] === undefined).length,
    (v.photos.length || (v.noPhoto && v.noPhotoReason.trim())) ? 0 : 1
  ];
}

/* =============================================================
   7) กล้อง — ถ่ายสดเท่านั้น ไม่มี <input type=file> ให้เลือกจากอัลบั้ม
   ============================================================= */
let camStream = null, camSim = false;
async function openCamera() {
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="cam" role="dialog" aria-modal="true" aria-label="ถ่ายรูปชั้นวาง">
    <div class="cam-top"><span>ถ่ายรูปชั้นวาง</span><span class="small" id="cam-mode" style="color:#BDB7AE">กำลังเปิดกล้อง…</span></div>
    <div class="cam-view"><video id="cam-video" playsinline muted autoplay></video><canvas id="cam-sim" width="720" height="960" hidden></canvas></div>
    <div class="cam-bar"><button class="ghost-dark" data-act="camClose">ยกเลิก</button><button class="shutter" data-act="camShot" aria-label="ถ่ายรูป"></button><span></span></div>
    <p class="cam-note">ไม่มีปุ่มเลือกรูปจากอัลบั้ม — ป้องกันการใช้รูปเก่า · เวลาและพิกัดจะถูกประทับลงรูป</p></div>`;
  m.hidden = false;
  const mode = document.getElementById('cam-mode');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-api');
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    document.getElementById('cam-video').srcObject = camStream; camSim = false; mode.textContent = 'กล้องจริง';
  } catch (e) {
    camSim = true; mode.textContent = 'โหมดจำลอง (ไม่พบกล้อง/ไม่ได้รับอนุญาต)';
    document.getElementById('cam-video').hidden = true;
    const c = document.getElementById('cam-sim'); c.hidden = false; drawShelf(c.getContext('2d'), c.width, c.height, Date.now() % 100000);
  }
}
function closeCamera() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = '';
}

/* =============================================================
   8) EXPORT CSV — หัวคอลัมน์รูปแบบเดียวกับไฟล์ Excel เดิม
   ============================================================= */
function csvCell(x) {
  let s = String(x == null ? '' : x);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // กัน CSV/Formula injection เวลาเปิดใน Excel
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv() {
  const S_ = PRODUCTS.filter(p => p.type === 'S'), C_ = PRODUCTS.filter(p => p.type === 'C'), P_ = PRODUCTS.filter(p => p.type === 'P');
  const head = ['Start time', 'Completion time', 'Received at server', 'เขต', 'Group', 'ประเภทร้านค้า', 'ประเภทร้าน', 'ประเภทแผ่นชั้น', 'รหัสสาขา', 'ชื่อสาขา',
    ...S_.map(p => 'S' + p.name), ...C_.map(p => p.name), ...P_.map(p => p.name), 'หมายเหตุ', 'Latitude', 'Longitude', 'ระยะห่างจากร้าน (ม.)', 'Flag'];
  const rows = S.server.slice().sort((a, b) => a.startedAt.localeCompare(b.startedAt)).map(v => {
    const u = userBy(v.user), st = storeBy(v.store);
    return [fmtDT(v.startedAt), fmtDT(v.completedAt), fmtDT(v.receivedAt), `${u.code} ${u.name}`, u.group, st.chain, st.type, st.shelf, st.code, st.name,
      ...S_.map(p => v.counts[p.id] ?? ''), ...C_.map(p => v.comp[p.id] ?? ''), ...P_.map(p => v.posm[p.id] ?? ''),
      [v.noPhoto ? 'ไม่อนุญาตให้ถ่ายรูป: ' + v.noPhotoReason : '', v.remark].filter(Boolean).join(' / '),
      v.lat.toFixed(6), v.lng.toFixed(6), v.distance, v.flags.join(' | ')];
  });
  const csv = '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `FieldAudit_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast(`ส่งออก ${rows.length} แถว — เปิดด้วย Excel หรือดึงเข้า Power BI ได้`);
}

      <div style="font-weight:600">${esc(p.name)}</div>
      <div class="seg2"><button class="opt txt ${c === 1 ? 'on' : ''}" aria-pressed="${c === 1}" data-act="posm" data-p="${p.id}" data-v="1">มี</button>
      <button class="opt txt ${c === 0 ? 'on' : ''}" aria-pressed="${c === 0}" data-act="posm" data-p="${p.id}" data-v="0">ไม่มี</button></div></div>`; }).join('')}
  </section>`;
}
function stepPhoto(v) {
  const miss = S.showMissing && missing(v)[3];
  return `<section class="card stack ${miss ? 'miss' : ''}" aria-labelledby="h-ph">
    <div class="between"><h2 id="h-ph" style="font-size:18px">รูปชั้นวางสินค้า</h2><span class="small muted">อย่างน้อย 1 รูป</span></div>
    ${v.noPhoto ? `<div><label class="lb" for="np-reason">เหตุผล / ผู้ที่ไม่อนุญาต</label>
        <input id="np-reason" type="text" data-bind="noPhotoReason" placeholder="เช่น ผู้จัดการสาขาไม่อนุญาต" value="${esc(v.noPhotoReason)}" maxlength="200">
        <div class="small muted" style="margin-top:6px">ระบบยังเก็บพิกัดและเวลาไว้เป็นหลักฐานแทนรูป</div></div>`
      : `<div class="photos">
        ${v.photos.map((p, i) => `<div class="ph"><img src="${p.data}" alt="รูปที่ ${i + 1} ถ่ายเวลา ${fmtTime(p.takenAt)}"><button class="x" data-act="delPhoto" data-i="${i}" aria-label="ลบรูปที่ ${i + 1}">${I.x}</button></div>`).join('')}
        <button class="addph" data-act="camera"><i>${I.cam}</i>ถ่ายรูป</button></div>
        <div class="small muted row" style="gap:6px">${I.lock} ถ่ายจากกล้องเท่านั้น · ประทับเวลาและพิกัดลงรูปอัตโนมัติ</div>`}
    <div class="between" style="border-top:1px solid var(--line2);padding-top:12px">
      <span id="np-label" style="font-weight:500">สาขาไม่อนุญาตให้ถ่ายรูป</span>
      <button class="switch" role="switch" aria-checked="${v.noPhoto}" aria-labelledby="np-label" data-act="noPhoto"><i></i></button>
    </div>
  </section>
  <section class="card"><label class="lb" for="remark">หมายเหตุ (ถ้ามี)</label><textarea id="remark" data-bind="remark" maxlength="500" placeholder="เช่น ร้านกำลังรีโนเวท">${esc(v.remark)}</textarea></section>`;
}

function vDone() {
  const v = S.lastDone, st = storeBy(v.store);
  const sent = S.server.find(x => x.id === v.id);
  const queued = S.queue.some(x => x.id === v.id);
  return `<main class="main">
    <div class="card stack" style="align-items:center;text-align:center;padding:28px 18px">
      <span class="ico ok" style="width:64px;height:64px;border-radius:32px">${I.check.replace('width="16" height="16"', 'width="32" height="32"')}</span>
      <h1 style="font-size:24px">บันทึกเรียบร้อย</h1>
      <div class="muted">${esc(st.name)} · ${fmtDur((new Date(v.completedAt) - new Date(v.startedAt)) / 1000)} นาที</div>
      ${queued ? `<div class="alert warn" style="text-align:left">${S.syncing ? 'กำลังส่งข้อมูล…' : 'ยังไม่มีสัญญาณ — ข้อมูลเก็บในเครื่องแล้ว จะส่งให้อัตโนมัติเมื่อออนไลน์'}</div>` : ''}
      ${sent ? `<div class="alert ${sent.flags.length ? 'flag' : 'ok'}" style="text-align:left;width:100%">${sent.flags.length ? `${I.flag}<span>ส่งแล้ว แต่ server flag ไว้: ${sent.flags.map(esc).join(' · ')}<br><span class="small">(ในเดโมมักโดน “ใช้เวลาน้อย” เพราะกดเร็ว — กฎขั้นต่ำ ${RULES.minDurationSec / 60} นาที)</span></span>` : 'ส่งเข้า server แล้ว ไม่มีความผิดปกติ'}</div>` : ''}
    </div>
    <button class="btn primary big block" data-act="go" data-to="pick">${I.pin} ตรวจร้านถัดไป</button>
    <button class="btn block" data-act="go" data-to="home">กลับหน้าแรก</button>
  </main>`;
}

function vQueue() {
  return `<main class="main">
    <div><h1 style="font-size:24px">คิวส่งข้อมูล</h1><p class="muted small" style="margin:2px 0 0">ข้อมูลบันทึกในเครื่องก่อนเสมอ แล้วค่อยส่งเมื่อมีสัญญาณ</p></div>
    ${S.queue.length ? S.queue.map(v => visitItem({ ...v, st: 'queued', flags: [] }, false)).join('') : `<div class="alert ok">${I.check} ไม่มีข้อมูลค้างส่ง</div>`}
    <button class="btn dark block" data-act="sync" ${!S.online || !S.queue.length || S.syncing ? 'disabled' : ''}>${S.syncing ? 'กำลังส่ง…' : 'ส่งตอนนี้'}</button>
    <div class="card stack">
      <b>ทดสอบ: ส่งข้อมูลซ้ำ</b>
      <div class="small muted">จำลองกรณีเน็ตหลุดระหว่างรอคำตอบ แล้วแอปส่งก้อนเดิมอีกรอบ — server จะเห็นว่า VisitId เดิมมีแล้วจึงไม่บันทึกซ้ำ</div>
      <button class="btn sm" data-act="resend" style="align-self:flex-start">ส่งรายการล่าสุดซ้ำ</button>
    </div>
    <div class="stack" style="gap:6px"><b>Sync log</b>
      <div class="log">${S.log.length ? S.log.slice(0, 30).map(l => `<div class="${l.status === 201 ? 'ok' : 'dup'}">${fmtTime(l.t)} POST /api/visits ${esc(l.id.slice(0, 8))}… สาขา ${esc(l.store)} → ${l.status} ${esc(l.note)}</div>`).join('') : '<div>ยังไม่มีการส่ง</div>'}</div>
    </div>
  </main>`;
}

function vDashboard() {
  const all = S.server.slice().sort((a, b) => b.startedAt.localeCompare(a.startedAt));
  const flagged = all.filter(v => v.flags.length);
  const list = S.filterFlag ? flagged : all;
  const avg = all.length ? all.reduce((a, v) => a + (new Date(v.completedAt) - new Date(v.startedAt)), 0) / all.length / 1000 : 0;
  const byUser = USERS.filter(u => u.role === 'FF').map(u => {
    const vs = all.filter(v => v.user === u.code);
    return { u, n: vs.length, f: vs.filter(v => v.flags.length).length, last: vs[0] };
  });
  return `<main class="main">
    <div class="between"><div><h1 style="font-size:24px">ภาพรวมวันนี้</h1><div class="small muted">${fmtDT(new Date()).slice(0, 10)} · ทีม BKK</div></div>
      <button class="btn sm dark" data-act="exportCsv">${I.dl} Export</button></div>
    <div class="kpis">
      <div class="kpi"><b>${all.length}</b><span>ร้านที่ตรวจแล้ว</span></div>
      <div class="kpi"><b>${new Set(all.map(v => v.user)).size}</b><span>พนักงานที่ออกตรวจ</span></div>
      <div class="kpi"><b style="color:${flagged.length ? 'var(--flag-ink)' : 'inherit'}">${flagged.length}</b><span>รายการถูก flag</span></div>
      <div class="kpi"><b>${fmtDur(avg)}</b><span>เวลาเฉลี่ยต่อร้าน (นาที)</span></div>
    </div>
    <section class="card"><h2 style="font-size:16px;margin-bottom:6px">รายคน</h2>
      <div style="overflow-x:auto"><table><thead><tr><th>พนักงาน</th><th class="num">ร้าน</th><th class="num">Flag</th><th class="num">ล่าสุด</th></tr></thead><tbody>
      ${byUser.map(r => `<tr><td>${esc(r.u.name)}<div class="tiny muted">${esc(r.u.code)}</div></td><td class="num">${r.n}</td><td class="num" style="color:${r.f ? 'var(--flag-ink)' : 'inherit'}">${r.f}</td><td class="num">${r.last ? fmtTime(r.last.completedAt) : '—'}</td></tr>`).join('')}
      </tbody></table></div></section>
    <div class="between"><h2 style="font-size:18px">รายการตรวจร้าน</h2>
      <div class="row" style="gap:4px" role="group" aria-label="ตัวกรอง">
        <button class="chip ${!S.filterFlag ? 'on' : ''}" style="height:36px" data-act="filter" data-v="all">ทั้งหมด</button>
        <button class="chip ${S.filterFlag ? 'on' : ''}" style="height:36px" data-act="filter" data-v="flag">มี flag</button></div></div>
    ${list.map(v => visitItem(v, true)).join('') || '<div class="card muted small">ไม่มีรายการ</div>'}
    <div class="alert info">ระบบจริง: ข้อมูลส่วนนี้มาจาก view <b>vw_VisitAnswers</b> ใน SQL Server และ Power BI ดึงไปทำรายงานต่อ</div>
  </main>`;
}

function vDetail() {
  const v = S.server.find(x => x.id === S.detailId); if (!v) { S.screen = 'dashboard'; return vDashboard(); }
  const st = storeBy(v.store), u = userBy(v.user);
  const ans = (type, map) => PRODUCTS.filter(p => p.type === type && map[p.id] !== undefined);
  const fl = id => { const f = v.follow[id]; if (!f) return ''; return [f.stock === 'yes' ? 'มีในสต๊อก' : f.stock === 'no' ? 'ไม่มีสต๊อก' : '', f.order === 'yes' ? 'สั่งเพิ่ม' : f.order === 'no' ? 'ไม่สั่ง' : '', f.reason || ''].filter(Boolean).join(' → '); };
  const payload = { ...v, photos: v.photos.map((p, i) => `photo_${i + 1}.jpg (${p.kb} KB) → เก็บเป็นไฟล์บน server, DB เก็บแค่ path`) };
  return `<main class="main">
    <button class="linkbtn row" data-act="go" data-to="dashboard" style="gap:6px">${I.back} กลับแดชบอร์ด</button>
    <section class="card flat"><div class="store-top"></div><div class="store-body">
      <div class="eyebrow">${esc(st.chain)} · รหัสสาขา ${esc(st.code)}</div><h1 class="store-name">${esc(st.name)}</h1>
      <div class="small muted">${esc(u.name)} (${esc(u.code)}) · ${fmtTime(v.startedAt)}–${fmtTime(v.completedAt)} · server รับ ${fmtTime(v.receivedAt)}</div></div>
      <div class="facts"><div class="fact"><span class="ico ${v.distance <= RULES.maxDistanceM ? 'ok' : 'warn'}">${I.pin}</span><div><b>ห่างร้าน ${fmtDist(v.distance)}</b><span>±${Math.round(v.acc)} ม.</span></div></div>
      <div class="fact"><span class="ico grey">${I.clock}</span><div><b>${fmtDur((new Date(v.completedAt) - new Date(v.startedAt)) / 1000)} นาที</b><span>ฟอร์ม v${v.formVersion}</span></div></div></div></section>
    ${v.flags.length ? `<div class="alert flag">${I.flag}<span>${v.flags.map(esc).join('<br>')}</span></div>` : `<div class="alert ok">${I.check} ไม่พบความผิดปกติ</div>`}
    <section class="card stack"><h2 style="font-size:16px">รูปถ่าย</h2>
      ${v.noPhoto ? `<div class="alert warn">งดถ่ายรูป: ${esc(v.noPhotoReason)}</div>` : `<div class="photos">${v.photos.map((p, i) => `<div class="ph"><img src="${p.data}" alt="รูปที่ ${i + 1}"></div>`).join('')}</div>`}</section>
    <section class="card"><h2 style="font-size:16px;margin-bottom:4px">คำตอบ</h2><div style="overflow-x:auto"><table>
      <thead><tr><th>สินค้าสก๊อต</th><th class="num">หน้า</th></tr></thead><tbody>
      ${ans('S', v.counts).map(p => `<tr><td>${esc(p.name)}${fl(p.id) ? `<div class="tiny" style="color:var(--gold-ink)">${esc(fl(p.id))}</div>` : ''}</td><td class="num">${v.counts[p.id]}</td></tr>`).join('')}</tbody>
      <thead><tr><th>คู่แข่ง</th><th class="num">หน้า</th></tr></thead><tbody>
      ${ans('C', v.comp).map(p => `<tr><td>${esc(p.name)}</td><td class="num">${v.comp[p.id]}</td></tr>`).join('')}</tbody>
      <thead><tr><th>POSM / พื้นที่พิเศษ</th><th class="num">มี</th></tr></thead><tbody>
      ${ans('P', v.posm).map(p => `<tr><td>${esc(p.name)}</td><td class="num">${v.posm[p.id] ? 'มี' : '—'}</td></tr>`).join('')}</tbody></table></div>
      ${v.remark ? `<div class="small" style="margin-top:8px"><b>หมายเหตุ:</b> ${esc(v.remark)}</div>` : ''}</section>
    <section class="stack" style="gap:6px"><b>ข้อมูลที่แอปส่งไป API (JSON)</b><pre class="json">${esc(JSON.stringify(payload, null, 2))}</pre></section>
  </main>`;
}

function vForm() {
  const group = (type, title, desc) => `<section class="card stack"><div><h2 style="font-size:16px">${title}</h2><div class="small muted">${desc}</div></div>
    ${PRODUCTS.filter(p => p.type === type).map(p => `<div class="between" style="border-top:1px solid var(--line2);padding-top:10px">
      <div style="min-width:0"><div style="font-weight:500;${p.active ? '' : 'color:var(--ink3);text-decoration:line-through'}">${esc(p.name)}</div><div class="tiny muted">${esc(p.id)}</div></div>
      <div class="row" style="gap:6px;flex-shrink:0">
        ${type === 'S' ? `<button class="chip ${p.focus ? 'on' : ''}" style="height:36px" aria-pressed="${!!p.focus}" data-act="pFocus" data-id="${esc(p.id)}">โฟกัส</button>` : ''}
        <button class="switch" role="switch" aria-checked="${p.active}" aria-label="ใช้งาน ${esc(p.name)}" data-act="pActive" data-id="${esc(p.id)}"><i></i></button></div></div>`).join('')}
  </section>`;
  return `<main class="main">
    <div><h1 style="font-size:24px">จัดการฟอร์มรายเดือน</h1><div class="small muted">เดือน ${esc(SEED.form.period)} · เวอร์ชัน ${S.formVersion} · สำหรับทีม BA</div></div>
    <div class="alert info">ปิด/เปิดสินค้า หรือเพิ่ม SKU ใหม่ แล้วล็อกอินเป็น FF จะเห็นฟอร์มเปลี่ยนทันที — ไม่ต้องแก้โค้ด (ระบบจริงเก็บเป็นตาราง FormVersions)</div>
    <section class="card stack"><label class="lb" for="new-sku" style="margin:0">เพิ่มสินค้าสก๊อตใหม่</label>
      <div class="row"><input id="new-sku" type="text" maxlength="120" placeholder="เช่น สก๊อต รังนก สูตรใหม่ 40 มล."><button class="btn dark" data-act="addSku">เพิ่ม</button></div></section>
    ${group('S', 'สินค้าสก๊อต', 'มีคำถามต่อเมื่อตอบ 0 (สต๊อก → สั่ง → เหตุผล)')}
    ${group('C', 'สินค้าคู่แข่ง', 'นับจำนวนหน้าอย่างเดียว')}
    ${group('P', 'POSM / พื้นที่พิเศษ', 'ตอบ มี / ไม่มี')}
  </main>`;
}

function render() {
  const app = document.getElementById('app');
  const views = { login: vLogin, home: vHome, pick: vPick, audit: vAudit, done: vDone, queue: vQueue, dashboard: vDashboard, detail: vDetail, form: vForm };
  app.innerHTML = header() + views[S.screen]() + (S.screen === 'audit' ? '' : '<div class="note">Scotch Field Audit · Concept prototype · ข้อมูลจำลองทั้งหมด</div>');
}

let toastTimer;
function toast(msg) {
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { r.innerHTML = ''; }, 3200);
}

/* =============================================================
   10) EVENTS — event delegation จุดเดียว
   ============================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'store-q') {          // อัปเดตเฉพาะรายการ ไม่ render ทั้งหน้า (input จะได้ไม่หลุด focus)
    S.search = t.value;
    const withD = STORES.map(s => ({ ...s, d: S.pos ? haversine(S.pos, s) : null }));
    document.getElementById('store-list').innerHTML = storeList(withD, withD.slice().sort((a, b) => a.d - b.d).slice(0, 5), S.search.trim().toLowerCase());
  }
  if (t.dataset.bind && S.visit) S.visit[t.dataset.bind] = t.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pin') A.login(); });
setInterval(() => { const el = document.getElementById('elapsed'); if (el && S.visit) el.textContent = fmtDur((Date.now() - new Date(S.visit.startedAt)) / 1000); }, 1000);

seedToday();
render();
</script>
</body>
</html>
